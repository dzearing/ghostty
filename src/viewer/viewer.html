<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Viewer</title>
<link rel="stylesheet" href="vendor/github-markdown.css">
<link rel="stylesheet" href="vendor/hljs-github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/hljs-github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="viewer.css">
<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/markdown-it-task-lists.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/dompurify.min.js"></script>
</head>
<body>
<!-- Table of contents. Hidden until viewer.js finds two or more headings in
     a rendered markdown document (body gains .viewer-has-toc); a wide pane
     shows it as a left gutter, a narrow one collapses it behind the toggle
     button below. Both are pure CSS media queries so a split-tree drag
     reflows the pane live. -->
<button id="toc-toggle" class="viewer-toc-toggle" type="button"
        aria-label="Table of contents" aria-expanded="false" aria-controls="toc">
  <svg class="viewer-toc-icon viewer-toc-icon-menu" viewBox="0 0 16 16" aria-hidden="true">
    <path d="M2.75 4.25h10.5M2.75 8h10.5M2.75 11.75h10.5"/>
  </svg>
  <svg class="viewer-toc-icon viewer-toc-icon-close" viewBox="0 0 16 16" aria-hidden="true">
    <path d="M4 4l8 8M12 4l-8 8"/>
  </svg>
</button>
<nav id="toc" class="viewer-toc" aria-label="Table of contents">
  <div class="viewer-toc-title">Contents</div>
  <ul id="toc-list" class="viewer-toc-list"></ul>
</nav>
<article id="content" class="markdown-body"></article>
<script src="viewer.js"></script>
</body>
</html>
