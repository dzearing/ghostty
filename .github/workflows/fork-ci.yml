on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

name: Fork CI

# We only want the latest commit to test for any non-main ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

# This workflow is owned by the fork. Upstream's test.yml/nix.yml are
# deliberately left untouched: every one of their jobs is gated on
# `github.repository == 'ghostty-org/ghostty'` and pinned to
# `namespace-profile-ghostty-*` runners that only exist in upstream's
# Namespace fleet, so they are inert here by design. Editing them to run on
# the fork would mean re-resolving 15 guards and 48 runner labels on every
# upstream merge. This file runs on GitHub-hosted runners instead.
jobs:
  build-test:
    # Stay inert if someone forks the fork, matching the guard style upstream
    # uses throughout test.yml.
    if: github.repository == 'dzearing/ghoztty'
    runs-on: macos-latest
    # Nothing here should take an hour. The inherited vouch-* workflows had no
    # timeout and no reachable runner, so each one sat queued for a full 24h
    # before GitHub killed it — a red X on every PR that meant nothing.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The Swift sources use macOS 26 APIs behind @available guards, so the
      # runner image has to carry the macOS 26 SDK. Logged rather than asserted
      # so a runner-image bump shows up here instead of as a confusing compile
      # error a hundred lines down.
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          echo "xcode-select -p: $(xcode-select -p)"
          echo "sdk path: $(xcrun --sdk macosx --show-sdk-path)"

      # Zig links the native macOS target against libSystem from the SDK it
      # locates via xcrun. Upstream never exercises this path — their CI runs
      # zig inside `nix develop`, which supplies an SDK — so on a bare runner
      # Zig can fail to resolve one and the link dies on undefined libSystem
      # symbols (_free, _malloc_size, __availability_version_check ...) while
      # building nothing more than the build runner itself. Pin SDKROOT and
      # DEVELOPER_DIR explicitly rather than relying on that detection.
      - name: Export macOS SDK paths
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> $GITHUB_OUTPUT

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      # Temporary: locate why Zig cannot resolve libSystem on this image.
      # Non-fatal so the real steps still run and one round trip yields both.
      - name: Diagnose Zig libSystem resolution
        continue-on-error: true
        run: |
          echo "--- CommandLineTools ---"
          ls -d /Library/Developer/CommandLineTools 2>/dev/null || echo "ABSENT"
          ls /Library/Developer/CommandLineTools/SDKs/ 2>/dev/null || echo "no CLT SDKs"
          echo "--- tbd targets ---"
          sed -n '1,3p' "$SDKROOT/usr/lib/libSystem.B.tbd" || echo "no libSystem.B.tbd"
          echo "--- zig env ---"
          zig env
          echo "--- minimal native link ---"
          printf 'pub fn main() void {}\n' > /tmp/t.zig
          zig build-exe /tmp/t.zig -femit-bin=/tmp/t.out && echo "MINIMAL LINK OK" || echo "MINIMAL LINK FAILED"

      # On macOS `zig build test` covers BOTH halves of the codebase: the Zig
      # unit tests and `xcodebuild test -scheme Ghostty -skip-testing
      # GhosttyUITests` (build.zig wires the xctest step into the test step via
      # GhosttyXcodebuild.zig). So this single step exercises the Zig core and
      # the Swift GhosttyTests suites.
      - name: Test
        run: zig build test

      # Proves the artifact the project actually ships from — the same command
      # CLAUDE.md tells contributors to run — still builds end to end.
      - name: Build debug app
        run: zig build -Doptimize=Debug
