on:
  pull_request: {}
  push:
    # The Windows branch is here for the windows-cross job (T578): the parity
    # loop pushes straight to it (no PRs), so without a push trigger nothing
    # in CI ever sees those commits and a broken cross-compile waits for a
    # release attempt to be found. build-test deliberately does NOT run on
    # those pushes -- see its `if:`.
    branches: [main, users/dzearing/windows-amd64]
  workflow_dispatch: {}

name: Fork CI

# We only want the latest commit to test for any non-main ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

# This workflow is owned by the fork. Upstream's test.yml/nix.yml are
# deliberately left untouched: every one of their jobs is gated on
# `github.repository == 'ghostty-org/ghostty'` and pinned to
# `namespace-profile-ghostty-*` runners that only exist in upstream's
# Namespace fleet, so they are inert here by design. Editing them to run on
# the fork would mean re-resolving 15 guards and 48 runner labels on every
# upstream merge. This file runs on GitHub-hosted runners instead.
jobs:
  build-test:
    # Stay inert if someone forks the fork, matching the guard style upstream
    # uses throughout test.yml. The second clause keeps this job's effective
    # triggers exactly what they were before the Windows branch joined the
    # push list above (PRs + main pushes): the Mac seat validates that branch
    # on-box, and turning a macOS CI run on for its every push is a separate
    # call from T578's Windows job, not a side effect of it.
    if: github.repository == 'dzearing/ghoztty' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: macos-latest
    # Nothing here should take an hour. The inherited vouch-* workflows had no
    # timeout and no reachable runner, so each one sat queued for a full 24h
    # before GitHub killed it — a red X on every PR that meant nothing.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The Swift sources use macOS 26 APIs behind @available guards, so the
      # runner image has to carry the macOS 26 SDK. Logged rather than asserted
      # so a runner-image bump shows up here instead of as a confusing compile
      # error a hundred lines down.
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version

      # Zig comes from Homebrew, NOT the official tarball that setup-zig
      # installs. This is load-bearing, so it is worth writing down: the
      # official aarch64-macos 0.15.2 binary cannot link ANYTHING on this
      # runner image — a bare `pub fn main() void {}` dies with ~25 undefined
      # libSystem symbols (_free, _malloc_size, __availability_version_check).
      # It is not the SDK. Pinning SDKROOT, pointing at the CommandLineTools
      # SDK, passing -lc, and moving the Zig cache out of the workspace were
      # all tried and all failed identically, against an SDK whose
      # libSystem.B.tbd does carry an arm64-macos slice. Homebrew's zig@0.15
      # is the same 0.15.2 with Apple SDK resolution patched, and it is what
      # the project is developed against locally. Upstream never hits this
      # because their macOS CI runs zig inside `nix develop`.
      - name: Setup Zig (Homebrew)
        run: |
          brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"

      - name: Verify Zig satisfies build.zig.zon
        run: |
          required="$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)"
          actual="$(zig version)"
          echo "required >= ${required}, have ${actual}"
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -1)" != "$required" ]; then
            echo "::error::Zig ${actual} is older than the required ${required}"
            exit 1
          fi

      # The two halves are run as separate steps ON PURPOSE. A plain
      # `zig build test` covers both — build.zig's `run:` block hands the test
      # step an xctest dependency via `addTestStepDependencies` — but then a
      # red X cannot tell you whether the Zig core or the Swift app broke.
      #
      # The flag that detaches it is `-Demit-xcframework=false`, NOT
      # `-Dapp-runtime=none`. On macOS `emit_xcframework` DEFAULTS to
      # `app_runtime == .none` (src/build/Config.zig), so `-Dapp-runtime=none`
      # is what switches the xcodebuild path ON — the first attempt at this
      # split passed it and still ran both halves in this one step, which is
      # how a Swift failure came back labeled "Test (Zig core)".
      # `emit_macos_app` derives from `emit_xcframework`, so the single flag
      # detaches the whole chain.
      - name: Test (Zig core)
        run: zig build test -Demit-xcframework=false

      # Proves the artifact the project actually ships from — the same command
      # CLAUDE.md tells contributors to run — still builds end to end. Also
      # produces the GhosttyKit xcframework the Swift tests link against.
      - name: Build debug app
        run: zig build -Doptimize=Debug

      # Kept separate from the Zig step so its failures are attributable, and
      # given a result bundle because xcodebuild's plain stdout does not say
      # why a test host failed to come up — it just lists every test as failed.
      - name: Test (Swift app)
        run: |
          cd macos
          xcodebuild test \
            -scheme Ghostty \
            -skip-testing GhosttyUITests \
            -arch arm64 \
            -resultBundlePath "${RUNNER_TEMP}/GhosttyTests.xcresult"

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcresult
          path: ${{ runner.temp }}/GhosttyTests.xcresult
          retention-days: 7

  # T578. Nothing outside release time built the Windows target in CI, so the
  # first time release-windows.yml's cross-compile ever ran on a Linux runner
  # was during an actual release (T577), three weeks after it was written.
  # This job runs the SAME artifact build the release runs --
  # build-release-artifacts.sh end to end, exe + MSI + portable ZIP, msitools
  # installed by the same shared script -- so a commit that breaks any of it
  # is red on the commit rather than at the tag. The on-box floor lanes
  # cannot stand in for this: they build natively on Windows, a different
  # host toolchain and linker path, and never touch the wixl/msiinfo
  # packaging.
  #
  # It builds and verifies only. Nothing is uploaded, published, or tagged.
  windows-cross:
    if: github.repository == 'dzearing/ghoztty'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Gate on the TREE, not the branch name: the win32 frontend exists only
      # on users/dzearing/windows-amd64 (main's apprt enum is gtk/none/
      # embedded), so on a main push or a PR against main there is nothing to
      # cross-compile and every later step no-ops green. Keying on content
      # also means a PR against the Windows branch -- from any ref -- gets
      # the real build, which is what makes the deliberate-break check in
      # T578's validation runnable without pushing a broken commit to the
      # shared branch.
      - name: Detect the Windows frontend
        id: detect
        run: |
          if [ -d src/apprt/win32 ] && [ -x dist/windows-installer/build-release-artifacts.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no win32 frontend in this tree -- nothing to cross-compile"
          fi

      # Same action, same (default) inputs as release-windows.yml -- it
      # resolves the version from build.zig.zon's minimum_zig_version, and
      # proving the release path means using the release's toolchain setup,
      # not this job's own idea of one. Pinned by sha per this file's style;
      # the release workflow floats on @v2, which is close enough to one
      # definition until merge-back consolidates them.
      - name: Setup Zig
        if: steps.detect.outputs.present == 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      - name: Build and install msitools 0.106 (wixl, msiinfo, msibuild)
        if: steps.detect.outputs.present == 'true'
        run: dist/windows-installer/install-msitools.sh

      # The exact command the release runs, at a version no release will ever
      # carry. 0.0.0 keeps the artifacts unmistakably CI-only while
      # exercising every real step: the ReleaseFast x86_64-windows-gnu
      # cross-compile, the version-string embedding check, wixl's MSI build
      # (PATH component included), and the portable-ZIP layout gates.
      - name: Build Windows release artifacts (not published)
        if: steps.detect.outputs.present == 'true'
        run: |
          dist/windows-installer/build-release-artifacts.sh --semver 0.0.0
