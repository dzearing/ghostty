on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

name: Fork CI

# We only want the latest commit to test for any non-main ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

# This workflow is owned by the fork. Upstream's test.yml/nix.yml are
# deliberately left untouched: every one of their jobs is gated on
# `github.repository == 'ghostty-org/ghostty'` and pinned to
# `namespace-profile-ghostty-*` runners that only exist in upstream's
# Namespace fleet, so they are inert here by design. Editing them to run on
# the fork would mean re-resolving 15 guards and 48 runner labels on every
# upstream merge. This file runs on GitHub-hosted runners instead.
jobs:
  build-test:
    # Stay inert if someone forks the fork, matching the guard style upstream
    # uses throughout test.yml.
    if: github.repository == 'dzearing/ghoztty'
    runs-on: macos-latest
    # Nothing here should take an hour. The inherited vouch-* workflows had no
    # timeout and no reachable runner, so each one sat queued for a full 24h
    # before GitHub killed it — a red X on every PR that meant nothing.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The Swift sources use macOS 26 APIs behind @available guards, so the
      # runner image has to carry the macOS 26 SDK. Logged rather than asserted
      # so a runner-image bump shows up here instead of as a confusing compile
      # error a hundred lines down.
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version

      # Zig comes from Homebrew, NOT the official tarball that setup-zig
      # installs. This is load-bearing, so it is worth writing down: the
      # official aarch64-macos 0.15.2 binary cannot link ANYTHING on this
      # runner image — a bare `pub fn main() void {}` dies with ~25 undefined
      # libSystem symbols (_free, _malloc_size, __availability_version_check).
      # It is not the SDK. Pinning SDKROOT, pointing at the CommandLineTools
      # SDK, passing -lc, and moving the Zig cache out of the workspace were
      # all tried and all failed identically, against an SDK whose
      # libSystem.B.tbd does carry an arm64-macos slice. Homebrew's zig@0.15
      # is the same 0.15.2 with Apple SDK resolution patched, and it is what
      # the project is developed against locally. Upstream never hits this
      # because their macOS CI runs zig inside `nix develop`.
      - name: Setup Zig (Homebrew)
        run: |
          brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"

      - name: Verify Zig satisfies build.zig.zon
        run: |
          required="$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)"
          actual="$(zig version)"
          echo "required >= ${required}, have ${actual}"
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -1)" != "$required" ]; then
            echo "::error::Zig ${actual} is older than the required ${required}"
            exit 1
          fi

      # On macOS `zig build test` covers BOTH halves of the codebase: the Zig
      # unit tests and `xcodebuild test -scheme Ghostty -skip-testing
      # GhosttyUITests` (build.zig wires the xctest step into the test step via
      # GhosttyXcodebuild.zig). So this single step exercises the Zig core and
      # the Swift GhosttyTests suites.
      - name: Test
        run: zig build test

      # Proves the artifact the project actually ships from — the same command
      # CLAUDE.md tells contributors to run — still builds end to end.
      - name: Build debug app
        run: zig build -Doptimize=Debug
