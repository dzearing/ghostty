on:
  push:
    # TWO patterns, for two different worlds (T577).
    #
    #   win-v*  is the one that works TODAY. A workflow runs from the tree of
    #           the ref that triggered it, and the Windows frontend
    #           (src/apprt/win32, dist/windows-installer, dist/website) exists
    #           ONLY on users/dzearing/windows-amd64 -- origin/main's apprt
    #           enum is gtk/none/embedded, so `-Dapp-runtime=win32` is not
    #           even a valid option there. A vX.Y.Z tag is cut from main, so
    #           it carries neither this file nor anything it builds: putting
    #           this workflow on main would not produce a Windows release, it
    #           would produce a red run on every macOS release. So a Windows
    #           release is cut as its OWN tag on the Windows branch, which is
    #           the only ref whose tree can build one.
    #
    #   v*      is the one that takes over at the cutover, unchanged. Once the
    #           Windows branch is in main, a vX.Y.Z tag carries the win32
    #           source and this workflow fires from it -- "every release ships
    #           Windows too" without anyone rewiring anything. It is
    #           deliberately the SAME pattern release.yml uses, not a stricter
    #           one: a tag that reaches the macOS job must reach this one, and
    #           a tag that is not X.Y.Z fails loudly below rather than being
    #           silently skipped here.
    #
    # `v*` does not match `win-v1.31.0` (tag globs are anchored), so the two
    # patterns never double-fire, and release.yml's own `v*` never picks up a
    # win-v tag and tries to notarize a DMG for it.
    tags:
      - "v*"
      - "win-v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z, no leading v)"
        required: true
      publish:
        description: "Publish the win-v release (off = build artifacts only)"
        type: boolean
        default: false

name: Release (Windows)

# The Windows half of a release (T38). It builds the Windows terminal at the
# version a release carries, so one release produces both platforms'
# artifacts at the same version -- Ghoztty-<version>-x64.msi and
# Ghoztty-portable-<version>-x64.zip alongside Ghoztty-<version>-arm64.dmg.
# Until the cutover that is two tag pushes rather than one, for the reason
# spelled out on the triggers above; the version number is what ties them.
#
# workflow_dispatch is listed but is INERT until the cutover: GitHub only
# offers manual dispatch for workflows on the default branch, and this file
# is not on main. Cutting a win-v tag is the way to run it today.
#
# It is a SEPARATE workflow, not a job in release.yml, for two reasons: the
# macOS job is a signing/notarization pipeline that a Windows failure must
# not be able to interrupt, and the Windows artifacts publish onto their own
# win-v<version> release (created with --latest=false). That tag is a
# contract, not a preference: installed Windows builds find updates by
# scanning the releases list for the newest win-v tag
# (src/apprt/win32/update_check.zig), so publishing Windows assets onto the
# vX.Y.Z release instead would make every installed build blind to updates.
#
# Everything the artifacts are made of lives in
# dist/windows-installer/build-release-artifacts.sh, which the on-box manual
# path (scripts/publish-windows-release.ps1) runs too -- so CI and a hand
# publish cannot drift apart. Nothing here needs a Windows runner: the exe
# cross-compiles for x86_64-windows-gnu and the MSI is built with wixl.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2

      # msitools is BUILT, not apt-installed (0.106 from source; ubuntu's
      # 0.103 wixl cannot parse the <Environment> element the PATH component
      # needs). The whole story lives in the script, which is shared with
      # fork-ci.yml's per-commit Windows job (T578) -- CI proving the release
      # path only counts if both install the toolchain the same way.
      - name: Build and install msitools 0.106 (wixl, msiinfo, msibuild)
        run: dist/windows-installer/install-msitools.sh

      - name: Set release variables
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Both trigger shapes land here: `v1.31.0` and `win-v1.31.0` are
            # the same version, published onto the same win-v release. Strip
            # the optional `win-` first, then the `v` -- doing it in one
            # substitution would leave `win-v1.31.0` untouched (the prefix
            # `refs/tags/v` simply does not match) and fail the regex below
            # with a message about a version that was never malformed.
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#win-}
            VERSION=${VERSION#v}
            PUBLISH=true
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION=${VERSION#v}
            PUBLISH="${{ github.event.inputs.publish }}"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be X.Y.Z (got '$VERSION')"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PUBLISH=$PUBLISH" >> $GITHUB_ENV
          echo "TAG=win-v$VERSION" >> $GITHUB_ENV
          echo "MSI=zig-out/Ghoztty-$VERSION-x64.msi" >> $GITHUB_ENV
          echo "ZIP=zig-out/Ghoztty-portable-$VERSION-x64.zip" >> $GITHUB_ENV

      - name: Build Windows artifacts
        env:
          # Public Google OAuth client id, baked into the exe via
          # -Dgoogle-client-id so the SHIPPED terminal can start the
          # relay-brokered sign-in (T795). The same secret release.yml's macOS
          # job has used since T93 -- both seats must bake the SAME credential
          # or the two clients sign in to different projects. The confidential
          # client secret lives only on the relay, never here.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          # The same-day rebuild counter: republishing a version on the same
          # date needs a strictly greater MSI ProductVersion or the package
          # refuses to install over itself. It is kept to TWO digits on
          # purpose -- ProductVersion is yy.m.d<NN>, so a three-digit NN
          # makes day 1 run 999 (26.8.1999) outrank day 2 run 1 (26.8.201)
          # and the upgrade ordering inverts. github.run_number is
          # monotonic, so mod 99 only repeats after 99 releases in one day.
          BUILD_NUM=$(( (${{ github.run_number }} - 1) % 99 + 1 ))
          dist/windows-installer/build-release-artifacts.sh \
            --semver "$VERSION" --build-num "$BUILD_NUM"

      - name: Verify artifacts
        run: |
          # The point of the release is the PAIR, at one version. Assert both
          # exist under their versioned names before anything is published --
          # a missing half is how a "successful" release ships one platform.
          for f in "$MSI" "$ZIP"; do
            [ -f "$f" ] || { echo "::error::$f was not produced"; exit 1; }
            echo "$(du -h "$f")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ghoztty-windows-${{ env.VERSION }}
          path: |
            ${{ env.MSI }}
            ${{ env.ZIP }}

      - name: Publish win-v release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          Windows build of Ghoztty $VERSION (commit $(git rev-parse --short HEAD)),
          published alongside the macOS v$VERSION release.

          **Install:** download \`Ghoztty-$VERSION-x64.msi\` and run it (per-user, no
          admin). Upgrades an existing install in place -- close Ghoztty first.

          **Portable:** \`Ghoztty-portable-$VERSION-x64.zip\` needs no installer --
          unzip it and run \`Ghoztty\ghoztty.exe\`.

          Installed builds update themselves from this channel: they check it, fetch
          the MSI in the background, and offer to install and reopen when you click
          the notification. \`auto-update = off\` in your config turns the check off;
          \`auto-update = check\` downloads only when you ask.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists -- replacing its assets"
            gh release upload "$TAG" "$MSI" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          else
            # --target names the commit a NEW tag should be created at, and is
            # meaningless once the tag exists -- which it does whenever this
            # run was triggered by a win-v tag push (the tag IS the trigger).
            # Passing it anyway would ask gh to move a tag it must not move.
            TARGET=()
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
              || TARGET=(--target "$(git rev-parse HEAD)")
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              "${TARGET[@]}" \
              --title "Ghoztty for Windows v$VERSION" \
              --latest=false --notes-file "$NOTES" \
              "$MSI" "$ZIP"
          fi
          echo "published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # T39. The site's Windows downloads move with the release that produced
      # them, in the same run -- the macOS half is still hand-edited at release
      # time and that is precisely how the Windows channel fell 24 releases
      # behind (T38). Runs AFTER the publish above, so the links can never
      # point at assets that do not exist.
      - name: Update website Windows download links
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The body of this step is dist/website/publish-windows-links.sh, and
        # it lives there for one reason (T353): the clone-rewrite-commit-push
        # is only half the job, and the other half -- the rebase-retry that
        # answers release.yml's concurrent appcast push -- does not execute on
        # a normal release at all. Inline in YAML, the first time it ran would
        # have been the first time a release depended on it. As a script it is
        # run for real, with a collision staged on purpose, by section G of
        # test\win32\website-windows-download.ps1.
        run: |
          dist/website/publish-windows-links.sh \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$VERSION" /tmp/gh-pages
