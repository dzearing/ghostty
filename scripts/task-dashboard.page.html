<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows parity — task status</title>
<style>
/* ---------------------------------------------------------------------------
   Palette. Two data colors only, both validated (adjacent CVD dE 28.6 light /
   27.9 dark, normal-vision 31.3 / 30.7, both >= 3:1 on their surface):
     done  #0ca30c  (status good, mode-invariant)
     open  #2a78d6 light / #3987e5 dark  (categorical slot 1)
   Status hues (warning/critical) are used ONLY for real statuses, never as
   extra series colors, and always beside a text label.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --surface-2: #f2f1ee;
  --plane:     #f9f9f7;
  --ink:       #0b0b0b;
  --ink-2:     #52514e;
  --muted:     #898781;
  --grid:      #e1e0d9;
  --axis:      #c3c2b7;
  --hairline:  rgba(11, 11, 11, 0.10);
  --done:      #0ca30c;
  --open:      #2a78d6;
  --warning:   #fab219;
  --critical:  #d03b3b;
  --shadow:    0 1px 2px rgba(11, 11, 11, 0.06);
  --tint:      rgba(42, 120, 214, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #232322; --plane: #0d0d0d;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --hairline: rgba(255,255,255,0.10);
    --done: #0ca30c; --open: #3987e5; --shadow: none;
    --tint: rgba(57, 135, 229, 0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --surface-2: #232322; --plane: #0d0d0d;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --hairline: rgba(255,255,255,0.10);
  --done: #0ca30c; --open: #3987e5; --shadow: none;
  --tint: rgba(57, 135, 229, 0.14);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: 0;
  background: var(--plane); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.shell { max-width: 1180px; margin: 0 auto; padding: 18px 16px 56px; display: grid; grid-template-columns: 168px 1fr; gap: 20px; align-items: start; }

/* Side nav --------------------------------------------------------------- */
.side { position: sticky; top: 18px; }
.brand { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 2px; padding: 0 10px; }
.brand-sub { font-size: 11px; color: var(--muted); padding: 0 10px; margin-bottom: 14px; word-break: break-all; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button {
  font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  background: none; border: 0; border-radius: 6px;
  padding: 7px 10px; color: var(--ink-2);
  display: flex; align-items: center; gap: 8px; width: 100%;
}
nav button:hover { background: var(--surface-2); color: var(--ink); }
nav button:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; }
nav button[aria-current="page"] { background: var(--tint); color: var(--ink); font-weight: 600; }
nav .badge {
  margin-left: auto; background: var(--critical); color: #fff;
  border-radius: 9px; min-width: 18px; height: 18px; padding: 0 5px;
  font-size: 11px; font-weight: 600; display: inline-flex;
  align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
}
.side-meta { margin-top: 16px; padding: 0 10px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 8px; align-items: center; }
.dot-live { width: 6px; height: 6px; border-radius: 50%; background: var(--done); display: inline-block; }
.dot-live.stale { background: var(--warning); }

@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; gap: 12px; padding-top: 12px; }
  .side { position: static; }
  .brand-sub { display: none; }
  nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
  nav button { width: auto; white-space: nowrap; padding: 6px 12px; }
  .side-meta { padding: 0; margin-top: 10px; }
}

/* Cards ------------------------------------------------------------------- */
.card { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 8px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card > h2 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
.card > .sub { color: var(--muted); font-size: 12px; margin: 2px 0 14px; }
h3.sec { font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 10px; }
h3.sec + .sub { margin-top: -6px; }

/* Lead -------------------------------------------------------------------- */
.lead { display: grid; grid-template-columns: minmax(180px, 230px) 1fr; gap: 12px; margin-bottom: 12px; }
@media (max-width: 720px) { .lead { grid-template-columns: 1fr; } }
.hero-val { font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.hero-val span { font-size: 24px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.hero-label { font-size: 13px; font-weight: 600; margin-top: 6px; }
.hero-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.meter { display: flex; gap: 2px; height: 8px; margin-top: 14px; }
.meter i { display: block; border-radius: 2px; }
.meter i.d { background: var(--done); }
.meter i.o { background: var(--open); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(126px, 1fr)); gap: 12px; align-content: start; }
.tile { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile .v { font-size: 26px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
.tile .l { color: var(--ink-2); font-size: 12px; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
.tile .n { color: var(--muted); font-size: 11px; margin-top: 2px; }
.swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }

/* Charts ------------------------------------------------------------------ */
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 3px; border-radius: 2px; display: block; }
.chart { width: 100%; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 10px; font-family: inherit; }
.chart text.lbl { fill: var(--ink-2); font-size: 11px; font-weight: 500; }
.chart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .tick { font-variant-numeric: tabular-nums; }

details.tv { margin-top: 12px; }
details.tv > summary { cursor: pointer; color: var(--muted); font-size: 12px; width: fit-content; padding: 2px 4px; margin-left: -4px; border-radius: 4px; }
details.tv > summary:hover { color: var(--ink-2); background: var(--surface-2); }
details.tv > summary:focus-visible { outline: 2px solid var(--open); outline-offset: 1px; }
.tv-wrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; position: sticky; top: 0; background: var(--surface-1); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 14px; }

/* Status pill ------------------------------------------------------------- */
.pill { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 11px; color: var(--ink-2); }
.pill i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pill.done i { background: var(--done); }
.pill.todo i { background: var(--open); }
.pill.in_progress i { background: var(--warning); }
.pill.blocked i { background: var(--critical); }
.pill.skipped i { background: var(--muted); }

/* Decisions --------------------------------------------------------------- */
.dec { border: 1px solid var(--hairline); border-left: 3px solid var(--warning); border-radius: 8px; background: var(--surface-1); padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
.dec-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.dec-id { font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.dec-title { font-size: 14px; font-weight: 600; flex: 1 1 240px; }
.chip { font-size: 11px; color: var(--ink-2); background: var(--surface-2); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
.chip.link { cursor: pointer; }
.chip.link:hover { background: var(--tint); color: var(--ink); }
.dec-why { font-size: 13px; color: var(--ink-2); margin-top: 8px; white-space: pre-wrap; }
.dec-assumed { font-size: 12px; color: var(--muted); margin-top: 8px; padding: 7px 10px; background: var(--surface-2); border-radius: 6px; }
.dec-assumed b { color: var(--ink-2); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.opt { display: block; width: 100%; text-align: left; font: inherit; cursor: pointer; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px; padding: 9px 12px; color: var(--ink); }
.opt:hover { border-color: var(--open); background: var(--tint); }
.opt:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; }
.opt b { font-weight: 600; font-size: 13px; display: block; }
.opt span { color: var(--muted); font-size: 12px; }
.dec-note { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.dec-note textarea { flex: 1 1 220px; min-height: 34px; font: inherit; font-size: 12px; color: var(--ink); background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px; padding: 7px 9px; resize: vertical; }
.dec-note textarea:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; }
.btn { font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 7px 14px; border: 1px solid var(--hairline); background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--tint); border-color: var(--open); }
.btn:focus-visible { outline: 2px solid var(--open); outline-offset: 1px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.primary { background: var(--open); border-color: var(--open); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }

/* Timeline ---------------------------------------------------------------- */
.day { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 8px; }
.day:first-child { margin-top: 0; }
.ev { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
.ev-rail { width: 8px; flex: none; display: flex; justify-content: center; padding-top: 5px; }
.ev-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
.ev.filed .ev-dot { background: var(--open); }
.ev.decision-opened .ev-dot { background: var(--warning); }
.ev.decision-resolved .ev-dot { background: var(--muted); }
.ev-body { flex: 1; min-width: 0; }
.ev-title { font-size: 13px; font-weight: 600; }
.ev-meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 3px 10px; }
.ev-sum { font-size: 12px; color: var(--ink-2); margin-top: 5px; }
.ev-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.ev-chips .lab { font-size: 11px; color: var(--muted); align-self: center; }
.more { margin-top: 14px; }

/* Filters + task table ---------------------------------------------------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters input, .filters select { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px; padding: 5px 8px; min-height: 30px; }
.filters input { flex: 1 1 180px; min-width: 130px; }
.filters input:focus-visible, .filters select:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; }
.count { color: var(--muted); font-size: 12px; align-self: center; }
.tasks td:first-child { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th.sortable:focus-visible { outline: 2px solid var(--open); outline-offset: -2px; }
th.sortable.active { color: var(--ink); font-weight: 600; }
td.fin { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.tasks tr.t-row { cursor: pointer; }
.tasks tr.t-row:hover td { background: var(--surface-2); }
.t-title { color: var(--ink); }
.t-sum { color: var(--muted); margin-top: 3px; display: none; }
.tasks tr.open .t-sum { display: block; }
.t-deps { color: var(--muted); font-size: 11px; margin-top: 3px; }
@media (max-width: 700px) { .hide-sm { display: none; } }

.empty { color: var(--muted); font-size: 12px; }
.att { display: flex; flex-direction: column; gap: 10px; }
.att-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface-2); border-radius: 6px; }
.att-row .bar { width: 3px; align-self: stretch; border-radius: 2px; flex: none; }
.att-row.in_progress .bar { background: var(--warning); }
.att-row.blocked .bar { background: var(--critical); }
.att-why { font-size: 12px; color: var(--muted); margin-top: 3px; }

#tip { position: fixed; z-index: 40; pointer-events: none; opacity: 0; transition: opacity .08s linear; background: var(--surface-1); color: var(--ink); border: 1px solid var(--hairline); border-radius: 6px; padding: 7px 9px; font-size: 12px; line-height: 1.45; box-shadow: 0 4px 14px rgba(0,0,0,.16); max-width: 260px; }
#tip .tt { font-weight: 600; margin-bottom: 3px; }
#tip .tr { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 12px; }
#tip i { width: 8px; height: 8px; border-radius: 2px; flex: none; }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; background: var(--surface-1); border: 1px solid var(--hairline); border-left: 3px solid var(--done); border-radius: 8px; padding: 10px 14px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity .15s; max-width: min(420px, 90vw); }
#toast.show { opacity: 1; }
#toast.bad { border-left-color: var(--critical); }
.err { background: var(--surface-1); border: 1px solid var(--critical); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; font-size: 12px; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">Windows parity</div>
    <div class="brand-sub" id="brandsub"></div>
    <nav id="nav"></nav>
    <div class="side-meta" id="meta"></div>
  </aside>
  <main>
    <div id="err"></div>
    <div id="view"><div class="loading">Loading task data…</div></div>
  </main>
</div>
<div id="tip" role="status" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ===========================================================================
   Windows-parity dashboard — three views behind a side nav.

     Activity  what needs a call, then what has happened (default)
     Data      the numbers and the charts
     Tasks     lookup and filtering

   Data comes from scripts/task-dashboard.js, which re-reads the task and
   decision files on every request. The page polls and re-renders in place,
   holding the previous render rather than flashing a skeleton, and skipping
   the re-render entirely when nothing changed — so a half-typed note in a
   decision card is never wiped by a poll.
   =========================================================================== */

var POLL_MS = 5000;
var PAGE_SIZE = 30;
var $ = function (s, r) { return (r || document).querySelector(s); };

var themeParam = /[?&]theme=(light|dark)/.exec(location.search);
if (themeParam) document.documentElement.setAttribute('data-theme', themeParam[1]);

var VIEWS = ['activity', 'data', 'tasks'];
var state = {
  data: null, sig: '', busy: false, pageVersion: null,
  sort: { key: 'id', dir: -1 },   // newest task first
  view: VIEWS.indexOf((location.hash || '').slice(1)) >= 0 ? location.hash.slice(1) : 'activity',
  filters: { q: '', status: '', seat: '', phase: '' },
  open: {},        // expanded task rows
  notes: {},       // in-progress decision notes, kept across re-renders
  shown: PAGE_SIZE // timeline paging
};

/* --- DOM helpers --------------------------------------------------------- */
function h(tag, attrs, kids) { var e = document.createElement(tag); apply(e, attrs, kids); return e; }
function s(tag, attrs, kids) { var e = document.createElementNS('http://www.w3.org/2000/svg', tag); apply(e, attrs, kids); return e; }
function apply(e, attrs, kids) {
  if (attrs) for (var k in attrs) {
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === 'text') e.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
    if (c == null || c === false) return;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* --- formatting ---------------------------------------------------------- */
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fDay(ts) { var d = new Date(ts); return MON[d.getMonth()] + ' ' + d.getDate(); }
function fDate(ts) { var d = new Date(ts); return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function fClock(ts) { return new Date(ts).toLocaleTimeString(); }
function fTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
function fDur(ms) {
  if (ms == null) return '';
  var sec = Math.round(ms / 1000);
  if (sec < 60) return sec + 's';
  var min = Math.round(sec / 60);
  if (min < 60) return min + 'm';
  var hr = Math.floor(min / 60);
  return hr + 'h ' + (min % 60) + 'm';
}
function fAgo(ts) {
  var d = Date.now() - ts;
  if (d < 6e4) return 'just now';
  if (d < 36e5) return Math.round(d / 6e4) + 'm ago';
  if (d < 864e5) return Math.round(d / 36e5) + 'h ago';
  var days = Math.round(d / 864e5);
  return days === 1 ? 'yesterday' : days + 'd ago';
}
function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function dayLabel(ts) {
  var t = dayKey(Date.now()), y = dayKey(Date.now() - 864e5), k = dayKey(ts);
  if (k === t) return 'Today';
  if (k === y) return 'Yesterday';
  return fDate(ts);
}
var STATUS_LABEL = { done: 'Done', todo: 'To do', in_progress: 'In progress', blocked: 'Blocked', skipped: 'Skipped' };

/* --- toast --------------------------------------------------------------- */
var toastT;
function toast(msg, bad) {
  var el = $('#toast');
  el.textContent = msg;
  el.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastT);
  toastT = setTimeout(function () { el.className = ''; }, 4200);
}

/* --- tooltip ------------------------------------------------------------- */
var tip = $('#tip');
function showTip(evt, title, rows) {
  var kids = [h('div', { class: 'tt', text: title })];
  rows.forEach(function (r) {
    kids.push(h('div', { class: 'tr' }, [
      r.color ? h('i', { style: { background: r.color } }) : null,
      document.createTextNode(r.label), h('b', { text: String(r.value) })
    ]));
  });
  tip.innerHTML = ''; apply(tip, null, kids);
  tip.style.opacity = '1'; moveTip(evt);
}
function moveTip(evt) {
  var pad = 12, w = tip.offsetWidth, ht = tip.offsetHeight;
  var x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + ht > innerHeight - 8) y = evt.clientY - ht - pad;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = '0'; }
document.addEventListener('scroll', hideTip, true);

/* --- scales -------------------------------------------------------------- */
function niceTicks(max, want) {
  if (max <= 0) return [0];
  var raw = max / (want || 4);
  var mag = Math.pow(10, Math.floor(Math.log10(raw)));
  var step = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; })
    .filter(function (v) { return v >= raw; })[0] || 10 * mag;
  var out = [];
  for (var v = 0; v <= max + step * 0.001; v += step) out.push(Math.round(v));
  return out;
}
function barPath(x, y, w, ht, r) {
  r = Math.max(0, Math.min(r, w, ht / 2));
  return 'M' + x + ',' + y + 'H' + (x + w - r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r +
    'V' + (y + ht - r) + 'a' + r + ',' + r + ' 0 0 1 ' + (-r) + ',' + r + 'H' + x + 'Z';
}
function colPath(x, y, w, ht, r) {
  r = Math.max(0, Math.min(r, w / 2, ht));
  return 'M' + x + ',' + (y + ht) + 'V' + (y + r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + (-r) +
    'H' + (x + w - r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r + 'V' + (y + ht) + 'Z';
}

/* ===========================================================================
   Charts (Data view)
   =========================================================================== */
function drawProgress(host, data) {
  var series = data.series;
  host.innerHTML = '';
  if (series.length < 2) { host.appendChild(h('div', { class: 'empty', text: 'Not enough history yet.' })); return; }

  var W = Math.max(280, host.clientWidth), H = 232;
  var pad = { t: 14, r: 74, b: 26, l: 34 };
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  var t0 = series[0].ts, t1 = series[series.length - 1].ts;
  var maxY = Math.max.apply(null, series.map(function (p) { return p.total; }));
  var ticks = niceTicks(maxY, 4), top = ticks[ticks.length - 1];
  var X = function (ts) { return pad.l + (t1 === t0 ? iw : ((ts - t0) / (t1 - t0)) * iw); };
  var Y = function (v) { return pad.t + ih - (v / top) * ih; };

  var svg = s('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img',
    'aria-label': 'Line chart: total tracked tasks rose to ' + data.counts.total + ' and completed tasks to ' +
      data.counts.done + ' between ' + fDate(t0) + ' and ' + fDate(t1) + '.' });

  ticks.forEach(function (v) {
    svg.appendChild(s('line', { class: 'grid', x1: pad.l, x2: pad.l + iw, y1: Y(v), y2: Y(v) }));
    svg.appendChild(s('text', { class: 'tick', x: pad.l - 7, y: Y(v) + 3, 'text-anchor': 'end', text: v }));
  });
  svg.appendChild(s('line', { class: 'axis', x1: pad.l, x2: pad.l + iw, y1: Y(0), y2: Y(0) }));

  var days = Math.max(1, Math.round((t1 - t0) / 864e5));
  var stepD = Math.max(1, Math.ceil(days / Math.max(2, Math.floor(iw / 62))));
  var lastX = -Infinity;
  for (var d = 0; d <= days; d += stepD) {
    var ts = t0 + d * 864e5;
    if (X(ts) > pad.l + iw - 12) break;
    svg.appendChild(s('text', { class: 'tick', x: X(ts), y: H - 8, 'text-anchor': 'middle', text: fDay(ts) }));
    lastX = X(ts);
  }
  if (pad.l + iw - lastX >= 38) {
    svg.appendChild(s('text', { class: 'tick', x: pad.l + iw, y: H - 8, 'text-anchor': 'end', text: fDay(t1) }));
  }

  var cDone = cssVar('--done'), cOpen = cssVar('--open'), cSurf = cssVar('--surface-1');
  var line = function (key) { return series.map(function (p, i) { return (i ? 'L' : 'M') + X(p.ts) + ',' + Y(p[key]); }).join(''); };
  var band = line('total') + series.slice().reverse().map(function (p) { return 'L' + X(p.ts) + ',' + Y(p.done); }).join('') + 'Z';
  svg.appendChild(s('path', { d: band, fill: cOpen, 'fill-opacity': 0.10 }));
  svg.appendChild(s('path', { d: line('done') + 'L' + X(t1) + ',' + Y(0) + 'L' + X(t0) + ',' + Y(0) + 'Z', fill: cDone, 'fill-opacity': 0.10 }));
  svg.appendChild(s('path', { d: line('total'), fill: 'none', stroke: cOpen, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  svg.appendChild(s('path', { d: line('done'), fill: 'none', stroke: cDone, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

  var last = series[series.length - 1];
  var yT = Y(last.total), yD = Y(last.done);
  if (Math.abs(yT - yD) < 15) { var m = (yT + yD) / 2; yT = m - 8; yD = m + 8; }
  [[last.total, Y(last.total), yT, cOpen, 'Total'], [last.done, Y(last.done), yD, cDone, 'Done']].forEach(function (e) {
    svg.appendChild(s('circle', { cx: X(last.ts), cy: e[1], r: 4, fill: e[3], stroke: cSurf, 'stroke-width': 2 }));
    svg.appendChild(s('text', { class: 'lbl', x: X(last.ts) + 10, y: e[2] + 4, text: e[4] + ' ' + e[0] }));
  });

  var cross = s('line', { class: 'axis', y1: pad.t, y2: pad.t + ih, opacity: 0 });
  var dotT = s('circle', { r: 4, fill: cOpen, stroke: cSurf, 'stroke-width': 2, opacity: 0 });
  var dotD = s('circle', { r: 4, fill: cDone, stroke: cSurf, 'stroke-width': 2, opacity: 0 });
  svg.appendChild(cross); svg.appendChild(dotT); svg.appendChild(dotD);
  var hit = s('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent' });
  svg.appendChild(hit);
  hit.addEventListener('mousemove', function (ev) {
    var r = svg.getBoundingClientRect();
    var px = (ev.clientX - r.left) * (W / r.width);
    var want = t0 + ((px - pad.l) / iw) * (t1 - t0);
    var best = series[0], bd = Infinity;
    for (var i = 0; i < series.length; i++) {
      var dd = Math.abs(series[i].ts - want);
      if (dd < bd) { bd = dd; best = series[i]; }
    }
    cross.setAttribute('x1', X(best.ts)); cross.setAttribute('x2', X(best.ts)); cross.setAttribute('opacity', 1);
    dotT.setAttribute('cx', X(best.ts)); dotT.setAttribute('cy', Y(best.total)); dotT.setAttribute('opacity', 1);
    dotD.setAttribute('cx', X(best.ts)); dotD.setAttribute('cy', Y(best.done)); dotD.setAttribute('opacity', 1);
    showTip(ev, fDate(best.ts), [
      { color: cOpen, label: 'Total scope', value: best.total },
      { color: cDone, label: 'Done', value: best.done + ' (' + pct(best.done, best.total) + '%)' },
      { label: 'Open', value: best.open }
    ]);
  });
  hit.addEventListener('mouseleave', function () {
    hideTip(); cross.setAttribute('opacity', 0); dotT.setAttribute('opacity', 0); dotD.setAttribute('opacity', 0);
  });

  host.appendChild(svg);
  host.appendChild(h('div', { class: 'legend' }, [
    h('span', null, [h('i', { style: { background: cOpen } }), 'Total scope']),
    h('span', null, [h('i', { style: { background: cDone } }), 'Done']),
    h('span', { style: { color: 'var(--muted)' }, text: 'shaded band = open work' })
  ]));
}

function drawDaily(host, data) {
  var days = data.daily;
  host.innerHTML = '';
  if (!days.length) { host.appendChild(h('div', { class: 'empty', text: 'No completions recorded yet.' })); return; }
  var W = Math.max(280, host.clientWidth), H = 150;
  var pad = { t: 16, r: 6, b: 24, l: 30 };
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  var maxY = Math.max.apply(null, days.map(function (d) { return d.count; }));
  var ticks = niceTicks(Math.max(1, maxY), 3), top = ticks[ticks.length - 1];
  var slot = iw / days.length, bw = Math.max(2, Math.min(24, slot - 3));
  var cDone = cssVar('--done');

  var svg = s('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img',
    'aria-label': 'Column chart of tasks completed per day, ' + days.length + ' days ending ' +
      fDate(days[days.length - 1].ts) + '. Busiest day: ' + maxY + '.' });
  ticks.forEach(function (v) {
    var y = pad.t + ih - (v / top) * ih;
    svg.appendChild(s('line', { class: 'grid', x1: pad.l, x2: pad.l + iw, y1: y, y2: y }));
    svg.appendChild(s('text', { class: 'tick', x: pad.l - 7, y: y + 3, 'text-anchor': 'end', text: v }));
  });
  svg.appendChild(s('line', { class: 'axis', x1: pad.l, x2: pad.l + iw, y1: pad.t + ih, y2: pad.t + ih }));

  var peak = days.reduce(function (a, b) { return b.count >= a.count ? b : a; }, days[0]);
  var everyN = Math.max(1, Math.ceil(days.length / Math.max(2, Math.floor(iw / 54))));
  days.forEach(function (d, i) {
    var x = pad.l + i * slot + (slot - bw) / 2, ht = (d.count / top) * ih;
    if (d.count > 0 && ht >= 1) svg.appendChild(s('path', { d: colPath(x, pad.t + ih - ht, bw, ht, 3), fill: cDone }));
    var hit = s('rect', { x: pad.l + i * slot, y: pad.t, width: slot, height: ih, fill: 'transparent' });
    hit.addEventListener('mousemove', function (ev) { showTip(ev, fDate(d.ts), [{ color: cDone, label: 'Completed', value: d.count }]); });
    hit.addEventListener('mouseleave', hideTip);
    svg.appendChild(hit);
    if (i % everyN === 0) svg.appendChild(s('text', { class: 'tick', x: pad.l + i * slot + slot / 2, y: H - 8, 'text-anchor': 'middle', text: fDay(d.ts) }));
  });
  if (peak.count > 0) {
    var pi = days.indexOf(peak);
    svg.appendChild(s('text', { class: 'lbl', x: pad.l + pi * slot + slot / 2, y: pad.t + ih - (peak.count / top) * ih - 5, 'text-anchor': 'middle', text: peak.count }));
  }
  host.appendChild(svg);
}

function drawPhases(host, data) {
  var all = data.phases;
  var rows = all.filter(function (r) { return r.open > 0; })
    .sort(function (a, b) { return b.open - a.open || b.total - a.total; });
  var finished = all.filter(function (r) { return r.open === 0 && r.total > 0; });
  host.innerHTML = '';
  if (!rows.length) { host.appendChild(h('div', { class: 'empty', text: 'No phase has open work.' })); return; }

  var W = Math.max(280, host.clientWidth);
  var labW = 34, valW = 74, rowH = 26, barH = 14, GAP = 2;
  var iw = Math.max(60, W - labW - valW), H = rows.length * rowH + 4;
  var maxT = Math.max.apply(null, rows.map(function (r) { return r.total; }));
  var cDone = cssVar('--done'), cOpen = cssVar('--open');

  var svg = s('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img',
    'aria-label': 'Stacked bars of done and open tasks for ' + rows.length + ' phases with work left.' });
  rows.forEach(function (r, i) {
    var y = i * rowH + 4, cy = y + barH / 2;
    svg.appendChild(s('text', { x: 0, y: cy + 4, class: 'lbl', text: r.phase === '—' ? '—' : r.phase }));
    var full = (r.total / maxT) * iw;
    var dw = r.total ? (r.done / r.total) * full : 0, ow = full - dw;
    var split = dw > 0 && ow > 0;
    if (split) { dw = Math.max(0, dw - GAP / 2); ow = Math.max(0, ow - GAP / 2); }
    if (dw >= 1.5) svg.appendChild(s('path', { d: barPath(labW, y, dw, barH, split ? 0 : 4), fill: cDone }));
    if (ow >= 1.5) svg.appendChild(s('path', { d: barPath(labW + dw + (split ? GAP : 0), y, ow, barH, 4), fill: cOpen }));
    svg.appendChild(s('text', { x: labW + full + 8, y: cy + 4, class: 'tick', text: r.done + '/' + r.total }));
    var hit = s('rect', { x: 0, y: y - 4, width: W, height: rowH, fill: 'transparent' });
    hit.addEventListener('mousemove', function (ev) {
      showTip(ev, r.phase === '—' ? 'Unphased' : 'Phase ' + r.phase, [
        { color: cDone, label: 'Done', value: r.done },
        { color: cOpen, label: 'Open', value: r.open },
        { label: 'Complete', value: pct(r.done, r.total) + '%' }
      ]);
    });
    hit.addEventListener('mouseleave', hideTip);
    svg.appendChild(hit);
  });
  host.appendChild(svg);
  host.appendChild(h('div', { class: 'legend' }, [
    h('span', null, [h('i', { style: { background: cDone } }), 'Done']),
    h('span', null, [h('i', { style: { background: cOpen } }), 'Open'])
  ]));
  if (finished.length) {
    var n = finished.reduce(function (a, r) { return a + r.total; }, 0);
    host.appendChild(h('div', { class: 'sub', style: { margin: '10px 0 0' },
      text: finished.length + ' phase' + (finished.length === 1 ? '' : 's') + ' complete: ' +
        finished.map(function (r) { return r.phase === '—' ? 'unphased' : r.phase; }).sort().join(', ') +
        ' (' + n + ' task' + (n === 1 ? '' : 's') + ')' }));
  }
}

function tableView(summary, headers, rows) {
  return h('details', { class: 'tv' }, [
    h('summary', { text: summary }),
    h('div', { class: 'tv-wrap' }, [h('table', null, [
      h('thead', null, [h('tr', null, headers.map(function (x, i) { return h('th', { class: i ? 'num' : '', text: x }); }))]),
      h('tbody', null, rows.map(function (r) { return h('tr', null, r.map(function (c, i) { return h('td', { class: i ? 'num' : '', text: c }); })); }))
    ])])
  ]);
}
function card(title, sub, body) {
  return h('section', { class: 'card' }, [h('h2', { text: title }), sub ? h('div', { class: 'sub', text: sub }) : null].concat(body));
}

/* ===========================================================================
   ACTIVITY view — what needs a call, then what has happened
   =========================================================================== */
function post(url, body) {
  return fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().then(function (j) {
      if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}

function resolveDecision(d, answerKey) {
  if (state.busy) return;
  var note = (state.notes[d.id] || '').trim();
  if (!answerKey && !note) { toast('Pick an option, or write a note saying what to do instead.', true); return; }
  state.busy = true;
  post('api/resolve', { id: d.id, answer: answerKey, note: note })
    .then(function () {
      delete state.notes[d.id];
      toast(d.id + ' resolved' + (d.task ? ' and folded into ' + d.task : '') + '.');
      return refresh(true);
    })
    .catch(function (e) { toast('Could not resolve ' + d.id + ': ' + e.message, true); })
    .finally(function () { state.busy = false; });
}

function decisionCard(d) {
  var opts = h('div', { class: 'opts' }, d.options.map(function (o, i) {
    return h('button', {
      class: 'opt', type: 'button',
      onclick: function () { resolveDecision(d, o.key); }
    }, [
      h('b', { text: (i + 1) + '. ' + o.label }),
      o.detail ? h('span', { text: o.detail }) : null
    ]);
  }));
  var ta = h('textarea', {
    placeholder: 'Or say what to do instead…', rows: 1,
    'aria-label': 'Resolution note for ' + d.id,
    oninput: function (e) { state.notes[d.id] = e.target.value; }
  });
  ta.value = state.notes[d.id] || '';
  return h('div', { class: 'dec' }, [
    h('div', { class: 'dec-top' }, [
      h('span', { class: 'dec-id', text: d.id }),
      h('span', { class: 'dec-title', text: d.title }),
      d.task ? h('span', { class: 'chip link', title: 'Show this task', text: d.task,
        onclick: function () { state.filters = { q: d.task, status: '', seat: '', phase: '' }; go('tasks'); } }) : null,
      h('span', { class: 'chip', text: d.kind })
    ]),
    d.why ? h('div', { class: 'dec-why', text: d.why }) : null,
    d.assumed ? h('div', { class: 'dec-assumed' }, [
      h('b', { text: 'Proceeding meanwhile with: ' }), d.assumed,
      h('div', { style: { marginTop: '3px' }, text: 'Nothing is blocked — this only changes what happens next.' })
    ]) : null,
    d.options.length ? opts : null,
    h('div', { class: 'dec-note' }, [
      ta,
      h('button', { class: 'btn', type: 'button', text: 'Resolve with note',
        onclick: function () { resolveDecision(d, null); } })
    ])
  ]);
}

function activityView(d) {
  var out = [];
  var open = d.decisions.filter(function (x) { return x.status !== 'resolved'; });

  var decHead = [
    h('h2', { text: open.length ? 'Needs your call' : 'Nothing needs your call' }),
    h('div', { class: 'sub', text: open.length
      ? 'The loop made these calls and kept going. Confirm one, or pick the other option and it folds back into the task.'
      : 'The loop files a decision here whenever it makes a judgement call you might want to overturn.' })
  ];
  var decBody = open.length ? open.map(decisionCard) : [h('div', { class: 'empty', text: 'No open decisions.' })];
  out.push(h('section', { class: 'card' }, decHead.concat(decBody)));

  // Attention: in-progress and blocked tasks belong in the feed, not buried
  // in a chart view — they are the other thing a human might need to unstick.
  var att = d.tasks.filter(function (t) { return t.bucket === 'in_progress' || t.bucket === 'blocked'; });
  if (att.length) {
    out.push(card('In flight and blocked', null, [h('div', { class: 'att' }, att.map(function (t) {
      return h('div', { class: 'att-row ' + t.bucket }, [
        h('i', { class: 'bar' }),
        h('div', null, [
          h('div', null, [
            h('span', { style: { fontWeight: '600', fontSize: '12px' }, text: t.id + ' ' }),
            h('span', { class: 'pill ' + t.bucket }, [h('i'), STATUS_LABEL[t.bucket]])
          ]),
          h('div', { style: { fontSize: '12px' }, text: t.title }),
          t.reason ? h('div', { class: 'att-why', text: t.reason }) : null
        ])
      ]);
    }))]));
  }

  // Timeline
  var items = d.activity.slice(0, state.shown);
  var body = [];
  var lastDay = null;
  items.forEach(function (a) {
    var k = dayKey(a.ts);
    if (k !== lastDay) { lastDay = k; body.push(h('div', { class: 'day', text: dayLabel(a.ts) })); }
    var cls = 'ev ' + a.kind + (a.kind === 'work' && !a.completed.length ? ' filed' : '');
    var meta = [h('span', { text: fTime(a.ts) }), h('span', { text: fAgo(a.ts) })];
    if (a.durationMs != null) meta.push(h('span', { text: 'took ' + fDur(a.durationMs) }));
    if (a.sha) meta.push(h('span', { text: a.sha }));

    var chips = [];
    if (a.completed.length) {
      chips.push(h('span', { class: 'lab', text: 'completed' }));
      a.completed.forEach(function (c) { chips.push(h('span', { class: 'chip', title: c.title, text: c.id })); });
    }
    if (a.filed.length) {
      chips.push(h('span', { class: 'lab', text: 'follow-ups filed' }));
      a.filed.forEach(function (c) { chips.push(h('span', { class: 'chip', title: c.title, text: c.id })); });
    }
    body.push(h('div', { class: cls }, [
      h('div', { class: 'ev-rail' }, [h('div', { class: 'ev-dot' })]),
      h('div', { class: 'ev-body' }, [
        h('div', { class: 'ev-title', text: a.title }),
        h('div', { class: 'ev-meta' }, meta),
        a.summary ? h('div', { class: 'ev-sum', text: a.summary }) : null,
        chips.length ? h('div', { class: 'ev-chips' }, chips) : null
      ])
    ]));
  });
  if (state.shown < d.activity.length) {
    body.push(h('div', { class: 'more' }, [
      h('button', { class: 'btn', type: 'button', text: 'Show ' + Math.min(PAGE_SIZE, d.activity.length - state.shown) + ' more',
        onclick: function () { state.shown += PAGE_SIZE; renderView(); } })
    ]));
  }
  out.push(card('Timeline', d.activity.length + ' events since ' + fDate(d.historyStart) +
    ' — each one is a commit that finished or filed work.', body.length ? body : [h('div', { class: 'empty', text: 'No activity yet.' })]));
  return out;
}

/* ===========================================================================
   DATA view
   =========================================================================== */
var charts = [];
function dataView(d) {
  charts = [];
  var out = [];
  var c = d.counts, p = pct(c.done, c.total);
  var hero = h('div', { class: 'card' }, [
    h('div', { class: 'hero-val' }, [String(p), h('span', { text: '%' })]),
    h('div', { class: 'hero-label', text: 'complete' }),
    h('div', { class: 'hero-sub', text: c.done + ' of ' + c.total + ' tracked tasks' }),
    h('div', { class: 'meter', title: c.done + ' done, ' + c.open + ' open' }, [
      c.done ? h('i', { class: 'd', style: { flex: c.done } }) : null,
      c.open ? h('i', { class: 'o', style: { flex: c.open } }) : null
    ])
  ]);
  var mac = (d.seats.filter(function (x) { return x.seat === 'mac'; })[0] || { open: 0 }).open;
  var tiles = [
    { v: c.open, l: 'Open', c: 'var(--open)', n: 'to do, in progress or blocked' },
    { v: d.doneLast7, l: 'Done in 7 days', c: 'var(--done)', n: 'completions since ' + fDay(d.generatedAt - 7 * 864e5) },
    { v: c.in_progress, l: 'In progress', c: 'var(--warning)' },
    { v: c.blocked, l: 'Blocked', c: 'var(--critical)' },
    { v: mac, l: 'Mac-seat open', c: 'var(--muted)', n: 'this box cannot validate these' },
    { v: c.skipped, l: 'Skipped / split', c: 'var(--muted)', n: 'not counted in scope' }
  ];
  out.push(h('div', { class: 'lead' }, [hero, h('div', { class: 'tiles' }, tiles.map(function (t) {
    return h('div', { class: 'tile' }, [
      h('div', { class: 'v', text: String(t.v) }),
      h('div', { class: 'l' }, [h('span', { class: 'swatch', style: { background: t.c } }), t.l]),
      t.n ? h('div', { class: 'n', text: t.n }) : null
    ]);
  }))]));

  var progHost = h('div');
  out.push(card('Progress over time',
    'Every commit that changed the tracker, since ' + fDate(d.historyStart) + '. Scope grows as new tasks are filed, so the gap is the work still open.',
    [progHost, tableView('Table view — weekly snapshots', ['Date', 'Total', 'Done', 'Open', '%'], weeklyRows(d))]));
  charts.push(function () { drawProgress(progHost, d); });

  var dailyHost = h('div');
  out.push(card('Completed per day', 'Tasks whose status first became done that day.',
    [dailyHost, tableView('Table view — all days', ['Day', 'Completed'], d.daily.map(function (x) { return [fDate(x.ts), x.count]; }))]));
  charts.push(function () { drawDaily(dailyHost, d); });

  var phaseHost = h('div');
  out.push(card('By phase', 'Phases with open work, most remaining first. Bar length is the phase’s size.',
    [phaseHost, tableView('Table view', ['Phase', 'Done', 'Open', 'Total', '%'],
      d.phases.map(function (r) { return [r.phase === '—' ? 'Unphased' : r.phase, r.done, r.open, r.total, pct(r.done, r.total) + '%']; }))]));
  charts.push(function () { drawPhases(phaseHost, d); });
  return out;
}

function weeklyRows(d) {
  var out = [], lastWeek = null;
  d.series.forEach(function (p, i) {
    var wk = Math.floor(p.ts / (7 * 864e5));
    if (wk !== lastWeek || i === d.series.length - 1) {
      lastWeek = wk;
      out.push([fDate(p.ts), p.total, p.done, p.open, pct(p.done, p.total) + '%']);
    }
  });
  return out;
}

/* ===========================================================================
   TASKS view
   =========================================================================== */
function tasksView(d) {
  var f = state.filters;
  var phases = [];
  d.tasks.forEach(function (t) { var p = t.phase || '—'; if (phases.indexOf(p) < 0) phases.push(p); });
  phases.sort();
  var sel = function (name, label, opts) {
    return h('select', { 'aria-label': label, onchange: function (e) { f[name] = e.target.value; renderTasks(); } },
      [h('option', { value: '', text: label })].concat(opts.map(function (o) {
        return h('option', { value: o[0], text: o[1], selected: f[name] === o[0] });
      })));
  };
  var input = h('input', {
    type: 'search', placeholder: 'Search id, title or summary…', 'aria-label': 'Search tasks',
    oninput: function (e) { f.q = e.target.value; renderTasks(); }
  });
  input.value = f.q;
  var controls = h('div', { class: 'filters' }, [
    input,
    sel('status', 'Any status', Object.keys(STATUS_LABEL).map(function (k) { return [k, STATUS_LABEL[k]]; })),
    sel('seat', 'Any seat', d.seats.map(function (x) { return [x.seat, 'Seat: ' + x.seat]; })),
    sel('phase', 'Any phase', phases.map(function (p) { return [p, p === '—' ? 'Unphased' : 'Phase ' + p]; })),
    h('span', { class: 'count', id: 'tcount' })
  ]);
  // Sortable: clicking a header toggles direction, clicking another switches
  // key. Newest-first is the default because a tracker is read for what just
  // landed, not for T01.
  var sortable = function (label, key, cls) {
    var active = state.sort.key === key;
    return h('th', {
      class: (cls || '') + ' sortable' + (active ? ' active' : ''),
      role: 'button', tabindex: '0',
      'aria-sort': active ? (state.sort.dir < 0 ? 'descending' : 'ascending') : 'none',
      onclick: function () { toggleSort(key); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSort(key); } }
    }, [label, active ? h('span', { class: 'arrow', text: state.sort.dir < 0 ? ' ▾' : ' ▴' }) : null]);
  };
  var table = h('table', { class: 'tasks' }, [
    h('thead', null, [h('tr', null, [
      sortable('ID', 'id'),
      h('th', { text: 'Status' }),
      h('th', { text: 'Task' }),
      sortable('Finished', 'finished'),
      h('th', { class: 'hide-sm', text: 'Phase' }),
      h('th', { class: 'hide-sm', text: 'Seat' })
    ])]),
    h('tbody', { id: 'tbody' })
  ]);
  return [card('All tasks', 'Newest first. Click a row for its summary, or a header to re-sort.',
    [controls, h('div', { class: 'tv-wrap' }, [table])])];
}

function toggleSort(key) {
  if (state.sort.key === key) state.sort.dir = -state.sort.dir;
  else state.sort = { key: key, dir: -1 };
  renderView();
}

/** T01 < T89b < T90b < T428 — number first, then suffix. */
function idRank(id) {
  var m = /^[A-Za-z]*(\d+)(.*)$/.exec(id || '');
  return m ? Number(m[1]) * 1000 + (m[2] ? m[2].charCodeAt(0) - 96 : 0) : 0;
}

function renderTasks() {
  var d = state.data;
  if (!d) return;
  var f = state.filters, q = f.q.trim().toLowerCase();
  var rows = d.tasks.filter(function (t) {
    if (f.status && t.bucket !== f.status) return false;
    if (f.seat && t.seat !== f.seat) return false;
    if (f.phase && (t.phase || '—') !== f.phase) return false;
    if (q && (t.id + ' ' + t.title + ' ' + t.summary).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });

  var dir = state.sort.dir;
  rows.sort(function (a, b) {
    if (state.sort.key === 'finished') {
      // Unfinished tasks have no date; park them after everything dated,
      // whichever direction is active, rather than letting 0 sort as "oldest".
      var av = a.completedAt, bv = b.completedAt;
      if (av == null && bv == null) return (idRank(b.id) - idRank(a.id)) * (dir < 0 ? 1 : -1);
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * dir;
    }
    return (idRank(a.id) - idRank(b.id)) * dir;
  });

  var body = $('#tbody');
  if (!body) return;
  body.innerHTML = '';
  rows.forEach(function (t) {
    var tr = h('tr', { class: 't-row' + (state.open[t.id] ? ' open' : ''),
      onclick: function () { state.open[t.id] = !state.open[t.id]; tr.classList.toggle('open'); } }, [
      h('td', { text: t.id }),
      h('td', null, [h('span', { class: 'pill ' + t.bucket }, [h('i'), STATUS_LABEL[t.bucket]])]),
      h('td', null, [
        h('div', { class: 't-title', text: t.title }),
        t.summary ? h('div', { class: 't-sum', text: t.summary }) : null,
        t.deps.length ? h('div', { class: 't-deps', text: 'deps: ' + t.deps.join(', ') }) : null
      ]),
      h('td', { class: 'fin', title: t.completedAt ? fDate(t.completedAt) + ' ' + fTime(t.completedAt) : '',
        text: t.completedAt ? fDay(t.completedAt) : (t.bucket === 'done' ? 'before tracking' : '—') }),
      h('td', { class: 'hide-sm', text: t.phase || '—' }),
      h('td', { class: 'hide-sm', text: t.seat })
    ]);
    body.appendChild(tr);
  });
  var c = $('#tcount');
  if (c) c.textContent = rows.length === d.tasks.length ? rows.length + ' tasks' : rows.length + ' of ' + d.tasks.length + ' tasks';
}

/* ===========================================================================
   Shell
   =========================================================================== */
function go(view) {
  state.view = view;
  if (location.hash.slice(1) !== view) location.hash = view;
  renderNav();
  renderView();
  scrollTo(0, 0);
}
addEventListener('hashchange', function () {
  var v = location.hash.slice(1);
  if (VIEWS.indexOf(v) >= 0 && v !== state.view) { state.view = v; renderNav(); renderView(); }
});

function renderNav() {
  var d = state.data;
  var nav = $('#nav');
  nav.innerHTML = '';
  [['activity', 'Activity'], ['data', 'Data'], ['tasks', 'Tasks']].forEach(function (v) {
    var badge = null;
    if (v[0] === 'activity' && d && d.openDecisions) badge = h('span', { class: 'badge', text: String(d.openDecisions) });
    nav.appendChild(h('button', {
      type: 'button', 'aria-current': state.view === v[0] ? 'page' : null,
      onclick: function () { go(v[0]); }
    }, [v[1], badge]));
  });
}

function renderView() {
  var d = state.data;
  if (!d) return;
  var host = $('#view');
  host.innerHTML = '';
  var nodes = state.view === 'data' ? dataView(d) : state.view === 'tasks' ? tasksView(d) : activityView(d);
  nodes.forEach(function (n) { host.appendChild(n); });
  if (state.view === 'tasks') renderTasks();
  if (state.view === 'data') drawAll();
}

function drawAll() { charts.forEach(function (fn) { fn(); }); }
var rt;
addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (state.view === 'data') drawAll(); }, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (state.view === 'data') drawAll(); });

function setMeta(d, stale) {
  $('#brandsub').textContent = d.branch || '';
  var m = $('#meta');
  m.innerHTML = '';
  apply(m, null, [
    h('span', { class: 'dot-live' + (stale ? ' stale' : '') }),
    h('span', { text: d.tasks.length + ' tasks' }),
    h('span', { text: (stale ? 'last good ' : '') + fClock(d.generatedAt) })
  ]);
}

function signature(d) {
  return JSON.stringify([
    d.counts,
    d.tasks.map(function (t) { return t.id + t.status + t.title; }),
    d.decisions.map(function (x) { return x.id + x.status + x.answer; }),
    d.activity.length, d.series.length, d.daily.map(function (x) { return x.count; })
  ]);
}

function refresh(force) {
  return fetch('api/data', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      // The served code changed under us (someone edited the dashboard). A
      // stale shell against a new API fails silently, so reload rather than
      // keep rendering something that is quietly wrong.
      if (state.pageVersion == null) state.pageVersion = d.pageVersion;
      else if (d.pageVersion !== state.pageVersion) { location.reload(); return; }
      $('#err').innerHTML = '';
      var sig = signature(d);
      state.data = d;
      if (force || sig !== state.sig) { state.sig = sig; renderNav(); renderView(); }
      setMeta(d, false);
    })
    .catch(function (e) {
      if (state.data) setMeta(state.data, true);
      $('#err').innerHTML = '';
      $('#err').appendChild(h('div', { class: 'err',
        text: 'Cannot reach the dashboard server (' + e.message + '). Showing the last good data. Restart: powershell -File scripts\\task-dashboard.ps1' }));
    });
}

function poll() { refresh(false).finally(function () { setTimeout(poll, POLL_MS); }); }
renderNav();
poll();
</script>
</body>
