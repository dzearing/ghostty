<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows parity — task status</title>
<style>
/* ---------------------------------------------------------------------------
   Palette. Two data colors only, both validated (adjacent CVD dE 28.6 light /
   27.9 dark, normal-vision 31.3 / 30.7, both >= 3:1 on their surface):
     done  #0ca30c  (status good, mode-invariant)
     open  #2a78d6 light / #3987e5 dark  (categorical slot 1)
   Status hues (warning/critical) are used ONLY for real statuses, never as
   extra series colors, and always beside a text label.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --surface-2: #f2f1ee;
  --plane:     #f9f9f7;
  --ink:       #0b0b0b;
  --ink-2:     #52514e;
  --muted:     #898781;
  --grid:      #e1e0d9;
  --axis:      #c3c2b7;
  --hairline:  rgba(11, 11, 11, 0.10);
  --done:      #0ca30c;
  --open:      #2a78d6;
  --warning:   #fab219;
  --critical:  #d03b3b;
  --shadow:    0 1px 2px rgba(11, 11, 11, 0.06);
  --tint:      rgba(42, 120, 214, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #232322; --plane: #0d0d0d;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --hairline: rgba(255,255,255,0.10);
    --done: #0ca30c; --open: #3987e5; --shadow: none;
    --tint: rgba(57, 135, 229, 0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --surface-2: #232322; --plane: #0d0d0d;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --hairline: rgba(255,255,255,0.10);
  --done: #0ca30c; --open: #3987e5; --shadow: none;
  --tint: rgba(57, 135, 229, 0.14);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: 0;
  background: var(--plane); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.shell { max-width: 1180px; margin: 0 auto; padding: 18px 16px 56px; display: grid; grid-template-columns: 168px 1fr; gap: 20px; align-items: start; }

/* Side nav --------------------------------------------------------------- */
.side { position: sticky; top: 18px; }
.brand { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 2px; padding: 0 10px; }
.brand-sub { font-size: 11px; color: var(--muted); padding: 0 10px; margin-bottom: 14px; word-break: break-all; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button {
  font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  background: none; border: 0; border-radius: 6px;
  padding: 7px 10px; color: var(--ink-2);
  display: flex; align-items: center; gap: 8px; width: 100%;
}
nav button:hover { background: var(--surface-2); color: var(--ink); }
nav button:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; }
nav button[aria-current="page"] { background: var(--tint); color: var(--ink); font-weight: 600; }
nav .badge {
  margin-left: auto; background: var(--critical); color: #fff;
  border-radius: 9px; min-width: 18px; height: 18px; padding: 0 5px;
  font-size: 11px; font-weight: 600; display: inline-flex;
  align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
}
.side-meta { margin-top: 16px; padding: 0 10px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 8px; align-items: center; }
.dot-live { width: 6px; height: 6px; border-radius: 50%; background: var(--done); display: inline-block; }
.dot-live.stale { background: var(--warning); }

@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; gap: 12px; padding-top: 12px; }
  .side { position: static; }
  .brand-sub { display: none; }
  nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
  nav button { width: auto; white-space: nowrap; padding: 6px 12px; }
  .side-meta { padding: 0; margin-top: 10px; }
}

/* Cards ------------------------------------------------------------------- */
.card { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 8px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card > h2 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
.card > .sub { color: var(--muted); font-size: 12px; margin: 2px 0 14px; }
h3.sec { font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 10px; }
h3.sec + .sub { margin-top: -6px; }

/* Lead -------------------------------------------------------------------- */
.lead { display: grid; grid-template-columns: minmax(180px, 230px) 1fr; gap: 12px; margin-bottom: 12px; }
@media (max-width: 720px) { .lead { grid-template-columns: 1fr; } }
.hero-val { font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.hero-val span { font-size: 24px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.hero-label { font-size: 13px; font-weight: 600; margin-top: 6px; }
.hero-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.meter { display: flex; gap: 2px; height: 8px; margin-top: 14px; }
.meter i { display: block; border-radius: 2px; }
.meter i.d { background: var(--done); }
.meter i.o { background: var(--open); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(126px, 1fr)); gap: 12px; align-content: start; }
.tile { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile .v { font-size: 26px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
.tile .l { color: var(--ink-2); font-size: 12px; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
.tile .n { color: var(--muted); font-size: 11px; margin-top: 2px; }
.swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }

/* Charts ------------------------------------------------------------------ */
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 3px; border-radius: 2px; display: block; }
.chart { width: 100%; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 10px; font-family: inherit; }
.chart text.lbl { fill: var(--ink-2); font-size: 11px; font-weight: 500; }
.chart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .tick { font-variant-numeric: tabular-nums; }

details.tv { margin-top: 12px; }
details.tv > summary { cursor: pointer; color: var(--muted); font-size: 12px; width: fit-content; padding: 2px 4px; margin-left: -4px; border-radius: 4px; }
details.tv > summary:hover { color: var(--ink-2); background: var(--surface-2); }
details.tv > summary:focus-visible { outline: 2px solid var(--open); outline-offset: 1px; }
.tv-wrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; position: sticky; top: 0; background: var(--surface-1); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 14px; }

/* Status pill ------------------------------------------------------------- */
.pill { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 11px; color: var(--ink-2); }
.pill i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pill.done i { background: var(--done); }
.pill.todo i { background: var(--open); }
.pill.in_progress i { background: var(--warning); }
.pill.blocked i { background: var(--critical); }
.pill.skipped i { background: var(--muted); }

/* Decisions --------------------------------------------------------------- */
.dec { position: relative; border: 1px solid var(--hairline); border-radius: 8px; background: var(--surface-1); padding: 14px 16px 14px 25px; margin-bottom: 10px; box-shadow: var(--shadow); }
/* Left accent drawn like .att-row .bar (inset, rounded), not a flush border-left */
.dec::before { content: ''; position: absolute; left: 12px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--warning); }
.dec-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.dec-id { font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.dec-title { font-size: 14px; font-weight: 600; flex: 1 1 240px; }
.chip { font-size: 11px; color: var(--ink-2); background: var(--surface-2); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
.chip.link { cursor: pointer; }
.chip.link:hover { background: var(--tint); color: var(--ink); }
.dec-why { font-size: 13px; color: var(--ink-2); margin-top: 8px; white-space: pre-wrap; }
.dec-assumed { font-size: 12px; color: var(--muted); margin-top: 8px; padding: 7px 10px; background: var(--surface-2); border-radius: 6px; }
.dec-assumed b { color: var(--ink-2); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.opt { display: block; width: 100%; text-align: left; font: inherit; cursor: pointer; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px; padding: 9px 12px; color: var(--ink); }
.opt:hover { border-color: var(--open); background: var(--tint); }
.opt:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; }
.opt b { font-weight: 600; font-size: 13px; display: block; }
.opt span { color: var(--muted); font-size: 12px; }
.opt .chip.rec { background: rgba(12, 163, 12, .14); color: var(--done); font-weight: 600; margin-left: 8px; vertical-align: 1px; }
.opt.recommended { border-color: color-mix(in srgb, var(--done) 45%, transparent); }
.pc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; margin-top: 8px; }
@media (max-width: 700px) { .pc-grid { grid-template-columns: 1fr; } }
.pc-head { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
.pc.pros .pc-head { color: var(--done); }
.pc.cons .pc-head { color: var(--critical); }
.pc.mit { margin-top: 8px; }
.pc.mit .pc-head { color: var(--warning); }
.pc-list { margin: 0; padding-left: 16px; color: var(--ink-2); font-size: 12px; }
.pc-list li { margin: 2px 0; }

/* Daily digest ------------------------------------------------------------ */
.digest-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 6px; }
.digest-head select { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px; padding: 5px 8px; }
/* The day header: the first thing the eye lands on over coffee. */
.digest-date { font-size: 24px; font-weight: 700; letter-spacing: -0.2px; margin: 2px 0 10px; }
/* Digest prose (Commentary AND Task triage) reads at article size — it is a
   morning read, not a data panel. The 13px .md base stays for task dialogs,
   where density wins. */
.digest-body { max-width: 860px; margin: 0 auto; }
/* The header and tabs center with the prose so the page reads as one column. */
.digest-date, .digest-tabs { max-width: 860px; margin-left: auto; margin-right: auto; }
.digest-body .md { font-size: 16px; line-height: 1.7; color: var(--ink); }
.digest-body .md p { margin: 14px 0; }
.digest-body .md ul, .digest-body .md ol { margin: 14px 0; }
.digest-body .md li { margin: 9px 0; }
/* Headings breathe: generous space ABOVE (section separation) and clear
   space below before the prose starts. */
.digest-body .md h2 { font-size: 18px; margin: 30px 0 12px; }
.digest-body .md h3 { font-size: 16px; margin: 26px 0 12px; }
.digest-body .md h4 { font-size: 13px; margin: 22px 0 10px; }
.digest-body .md h2:first-child, .digest-body .md h3:first-child { margin-top: 4px; }
.digest-body .md code { font-size: 13px; }
.digest-body .md pre.code code { font-size: 13px; }
/* Category tabs (Commentary / Task triage). */
.digest-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 12px; }
.digest-tab { font: inherit; font-size: 13px; color: var(--ink-2, var(--ink)); background: none; border: none; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; opacity: .75; }
.digest-tab:hover { opacity: 1; }
.digest-tab.active { opacity: 1; font-weight: 600; border-bottom-color: var(--open); }
.digest-tab:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; border-radius: 4px; }
.md { font-size: 13px; line-height: 1.6; color: var(--ink-2); }
.md h1, .md h2, .md h3, .md h4 { color: var(--ink); line-height: 1.3; margin: 18px 0 6px; }
.md h1 { font-size: 17px; } .md h2 { font-size: 15px; } .md h3 { font-size: 13px; } .md h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.md h1:first-child, .md h2:first-child { margin-top: 0; }
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md code { background: var(--surface-2); border-radius: 4px; padding: 1px 5px; font: 12px ui-monospace, "Cascadia Mono", Consolas, monospace; }
.md hr { border: 0; border-top: 1px solid var(--hairline); margin: 16px 0; }
.md a { color: var(--open); }
.md blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--axis); background: var(--surface-2); border-radius: 0 6px 6px 0; }
.dec-note { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.dec-note textarea { flex: 1 1 220px; min-height: 34px; font: inherit; font-size: 12px; color: var(--ink); background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px; padding: 7px 9px; resize: vertical; }
.dec-note textarea:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; }
.btn { font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 7px 14px; border: 1px solid var(--hairline); background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--tint); border-color: var(--open); }
.btn:focus-visible { outline: 2px solid var(--open); outline-offset: 1px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.primary { background: var(--open); border-color: var(--open); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
/* An armed override: the second click of a two-step action that overrules a
   recorded condition (reopening a blocked task). Warning-coloured so the
   button does not look like the same one that was just clicked. */
.btn.danger { background: var(--warning); border-color: var(--warning); color: #1a1200; }
.btn.danger:hover { filter: brightness(1.08); }

/* Timeline ---------------------------------------------------------------- */
.day { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 8px; }
.day:first-child { margin-top: 0; }
/* Each event is a summary card in the same card language as .dec (T505):
   the whole card is clickable and says so on hover — the L2 event dialog is
   behind it. */
.ev { display: flex; gap: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface-1);
  border: 1px solid var(--hairline); border-radius: 8px; box-shadow: var(--shadow); cursor: pointer; }
.ev:hover { background: var(--tint); border-color: var(--open); }
.ev:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; }
.ev-rail { width: 8px; flex: none; display: flex; justify-content: center; padding-top: 5px; }
.ev-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
.ev.filed .ev-dot { background: var(--open); }
.ev.decision-opened .ev-dot { background: var(--warning); }
.ev.decision-resolved .ev-dot { background: var(--muted); }
.ev-body { flex: 1; min-width: 0; }
.ev-title { font-size: 13px; font-weight: 600; }
.ev-meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 3px 10px; }
.ev-sum { font-size: 12px; color: var(--ink-2); margin-top: 5px; }
.ev-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.ev-chips .lab { font-size: 11px; color: var(--muted); align-self: center; }
.more { margin-top: 14px; }

/* Filters + task table ---------------------------------------------------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters input, .filters select { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px; padding: 5px 8px; min-height: 30px; }
.filters input { flex: 1 1 180px; min-width: 130px; }
.filters input:focus-visible, .filters select:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; }
/* The row count inside the card title: quiet, parenthetical. */
.card h2 .count { font-weight: 400; font-size: 13px; color: var(--ink-2); margin-left: 6px; }
/* Multiselect dropdown (status filter): a <details> styled like the selects. */
.filters details.ms { position: relative; }
.filters details.ms > summary { list-style: none; cursor: pointer; font: inherit; font-size: 12px; color: var(--ink); background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px; padding: 5px 8px; min-height: 30px; display: flex; align-items: center; gap: 6px; user-select: none; box-sizing: border-box; }
.filters details.ms > summary::-webkit-details-marker { display: none; }
.filters details.ms > summary::after { content: '▾'; opacity: .6; font-size: 10px; }
.filters details.ms > summary:focus-visible { outline: 2px solid var(--open); outline-offset: -1px; }
.ms-menu { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; min-width: 170px; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 8px; padding: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); display: flex; flex-direction: column; gap: 2px; }
.ms-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink); padding: 4px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.ms-item:hover { background: rgba(128, 128, 128, .14); }
/* The `.filters input` rule above is written for the SEARCH box (flex-fill,
   130px min-width, 30px min-height) and would inflate these checkboxes into
   giant flexing blocks that shove the labels to the far edge — override every
   sizing property it sets. */
.filters .ms-item input { accent-color: var(--open); margin: 0; flex: 0 0 auto; min-width: 0; width: 14px; height: 14px; min-height: 0; padding: 0; }
.ms-sep { border-top: 1px solid var(--hairline); margin: 4px 0; }
.count { color: var(--muted); font-size: 12px; align-self: center; }
.tasks td:nth-child(2) { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.ord, .tasks th:first-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th.sortable:focus-visible { outline: 2px solid var(--open); outline-offset: -2px; }
th.sortable.active { color: var(--ink); font-weight: 600; }
td.fin, td.when { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.tasks tr.t-row { cursor: pointer; }
.tasks tr.t-row:hover td { background: var(--surface-2); }
.tasks tr.t-row:focus-visible { outline: 2px solid var(--open); outline-offset: -2px; }
.t-title { color: var(--ink); }
.t-sum { color: var(--muted); margin-top: 3px; display: none; }
.t-deps { color: var(--muted); font-size: 11px; margin-top: 3px; }
@media (max-width: 700px) { .hide-sm { display: none; } }

/* Priority badge. Severity is never colour alone — the rank is written in the
   badge — so it survives a colour-blind reader and a greyscale screenshot. */
.pri { display: inline-block; min-width: 24px; text-align: center; padding: 1px 5px; border-radius: 4px;
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
  border: 1px solid var(--hairline); color: var(--muted); background: var(--surface-2); }
.pri.P0 { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 45%, transparent);
  background: color-mix(in srgb, var(--critical) 12%, transparent); }
.pri.P1 { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 45%, transparent);
  background: color-mix(in srgb, var(--warning) 12%, transparent); }
.pri.P2 { color: var(--ink-2); }

/* Category tag chip: a dot plus the word. The color is never the only
   signal — the label is always written — so tags survive greyscale. */
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2);
  background: var(--surface-2); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
.tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.tag.feature i { background: var(--open); }
.tag.fix i { background: var(--critical); }
.tag.polish i { background: #9a6fd0; }
.tag.perf i { background: var(--warning); }
.tag.test i { background: var(--done); }

/* Progress-log lines on the in-flight card */
.prog-line { font-size: 12px; color: var(--ink-2); padding: 2px 0; display: flex; gap: 8px; align-items: baseline; }
.prog-ts { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 11px; }

/* Event detail dialog (T505): the kind marker reuses the timeline dot
   colors, and each finished/filed task is a clickable row. */
.evk { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.evk i { width: 8px; height: 8px; border-radius: 50%; background: var(--done); flex: none; }
.evk.filed i { background: var(--open); }
.evk.decision-opened i { background: var(--warning); }

.evd-task { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--ink-2); padding: 3px 0; }

/* Clickable text titles (in-flight rows) + task-id links inside rendered markdown */

.tid-link:hover { text-decoration: underline; }

/* Task detail dialog */
dialog.taskdlg { width: min(820px, 92vw); max-height: 86vh; padding: 0; border: 1px solid var(--hairline);
  border-radius: 10px; background: var(--surface-1); color: var(--ink);

dialog.taskdlg::backdrop { background: rgba(0, 0, 0, .5); }
dialog.taskdlg header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 0 14px; }
.td-head { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.td-id { color: var(--muted); font-size: 12px; }
.td-x { margin-left: auto; font-size: 20px; line-height: 1; width: 28px; height: 28px; flex: none;
  border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
.td-x:hover { background: var(--surface-2); color: var(--ink); }
.td-x:focus-visible { outline: 2px solid var(--open); outline-offset: -2px; }
.td-title { margin: 8px 14px 0 14px; font-size: 15px; font-weight: 600; line-height: 1.35; }
.td-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px 0 14px; font-size: 12px; }
.td-bit b { color: var(--muted); font-weight: 500; margin-right: 5px; }
.td-why { margin: 10px 14px 0 14px; padding: 8px 10px; border-radius: 6px; font-size: 12px;
  color: var(--ink-2); background: var(--surface-2); }
.td-body { margin: 12px 14px; overflow: auto; flex: 1; min-height: 0; }
.td-md { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.55;
  color: var(--ink-2); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
dialog.taskdlg footer { padding: 10px 14px; border-top: 1px solid var(--hairline); background: var(--surface-2); }
.td-path { font-size: 11px; color: var(--muted); }

.empty { color: var(--muted); font-size: 12px; }
.att { display: flex; flex-direction: column; gap: 10px; }
.att-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface-2); border-radius: 6px; }
.att-row .bar { width: 3px; align-self: stretch; border-radius: 2px; flex: none; }
.att-row.in_progress .bar { background: var(--warning); }

.if-plain { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.if-plain.muted { color: var(--muted); }

pre.cmd { margin: 10px 0 0; padding: 9px 11px; background: var(--surface-2); border-radius: 6px; font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; color: var(--ink-2); }

#tip { position: fixed; z-index: 40; pointer-events: none; opacity: 0; transition: opacity .08s linear; background: var(--surface-1); color: var(--ink); border: 1px solid var(--hairline); border-radius: 6px; padding: 7px 9px; font-size: 12px; line-height: 1.45; box-shadow: 0 4px 14px rgba(0,0,0,.16); max-width: 260px; }
#tip .tt { font-weight: 600; margin-bottom: 3px; }
#tip .tr { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 12px; }
#tip i { width: 8px; height: 8px; border-radius: 2px; flex: none; }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; background: var(--surface-1); border: 1px solid var(--hairline); border-left: 3px solid var(--done); border-radius: 8px; padding: 10px 14px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity .15s; max-width: min(420px, 90vw); }

<body>
<div class="shell">
  <aside class="side">
    <div class="brand">Windows parity</div>
    <div class="brand-sub" id="brandsub"></div>
    <nav id="nav"></nav>
    <div class="side-meta" id="meta"></div>
  </aside>
  <main>
    <div id="err"></div>
    <div id="view"><div class="loading">Loading task data…</div></div>
  </main>
</div>
<div id="tip" role="status" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ===========================================================================
   Windows-parity dashboard — three views behind a side nav.

     Activity  what needs a call, then what has happened (default)
     Data      the numbers and the charts
     Tasks     lookup and filtering

   Data comes from scripts/task-dashboard.js, which re-reads the task and
   decision files on every request. The page polls and re-renders in place,
   holding the previous render rather than flashing a skeleton, and skipping
   the re-render entirely when nothing changed — so a half-typed note in a
   decision card is never wiped by a poll.
   =========================================================================== */

var POLL_MS = 5000;
var PAGE_SIZE = 30;
var $ = function (s, r) { return (r || document).querySelector(s); };

var themeParam = /[?&]theme=(light|dark)/.exec(location.search);
if (themeParam) document.documentElement.setAttribute('data-theme', themeParam[1]);

var VIEWS = ['activity', 'digest', 'data', 'tasks'];
var state = {
  data: null, sig: '', busy: false, pageVersion: null,
  sort: { key: 'order', dir: 1 }, // the work queue, head first
  view: VIEWS.indexOf((location.hash || '').slice(1)) >= 0 ? location.hash.slice(1) : 'activity',
  /* statuses: null = every status shown; else a {bucket: bool} map (the
     status filter is a MULTISELECT — the user unchecks e.g. Done to hide it,
     or any subset; a single-value select could not express "all but done"). */
  filters: { q: '', statuses: null, priority: '', seat: '', tag: '' },
  open: {},        // expanded task rows
  notes: {},       // in-progress decision notes, kept across re-renders
  digestDate: null,  // which digest is being read; null = newest
  digestTab: null,   // which category tab is open; null = first present
  digestCache: {},   // date -> body, so flipping between days does not refetch
  shown: PAGE_SIZE // timeline paging
};

/* --- DOM helpers --------------------------------------------------------- */
function h(tag, attrs, kids) { var e = document.createElement(tag); apply(e, attrs, kids); return e; }
function s(tag, attrs, kids) { var e = document.createElementNS('http://www.w3.org/2000/svg', tag); apply(e, attrs, kids); return e; }
function apply(e, attrs, kids) {
  if (attrs) for (var k in attrs) {
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === 'text') e.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
    if (c == null || c === false) return;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* --- formatting ---------------------------------------------------------- */
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fDay(ts) { var d = new Date(ts); return MON[d.getMonth()] + ' ' + d.getDate(); }
function fDate(ts) { var d = new Date(ts); return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function fClock(ts) { return new Date(ts).toLocaleTimeString(); }
function fTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
function fDur(ms) {
  if (ms == null) return '';
  var sec = Math.round(ms / 1000);
  if (sec < 60) return sec + 's';
  var min = Math.round(sec / 60);
  if (min < 60) return min + 'm';
  var hr = Math.floor(min / 60);
  if (hr < 24) return hr + 'h ' + (min % 60) + 'm';
  var day = Math.floor(hr / 24);
  return day + 'd ' + (hr % 24) + 'h';
}
function fAgo(ts) {
  var d = Date.now() - ts;
  if (d < 6e4) return 'just now';
  if (d < 36e5) return Math.round(d / 6e4) + 'm ago';
  if (d < 864e5) return Math.round(d / 36e5) + 'h ago';
  var days = Math.round(d / 864e5);
  return days === 1 ? 'yesterday' : days + 'd ago';
}
function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function dayLabel(ts) {
  var t = dayKey(Date.now()), y = dayKey(Date.now() - 864e5), k = dayKey(ts);
  if (k === t) return 'Today';
  if (k === y) return 'Yesterday';
  return fDate(ts);
}
var STATUS_LABEL = { done: 'Done', todo: 'To do', in_progress: 'In progress', blocked: 'Blocked', skipped: 'Skipped' };

/* --- tags ---------------------------------------------------------------- */
var TAG_TITLE = {
  feature: 'user-facing: new capability', fix: 'user-facing: defect fix',
  polish: 'user-facing: look and feel', perf: 'performance',
  test: 'test quality', infra: 'infra / tooling', docs: 'documentation', security: 'security'
};
function tagChips(tags) {
  return (tags || []).map(function (tg) {
    return h('span', { class: 'tag ' + tg, title: TAG_TITLE[tg] || tg }, [h('i'), tg]);
  });
}
function taskById(id) {
  if (!state.data) return null;
  var want = String(id || '').toUpperCase();
  return state.data.tasks.filter(function (t) { return t.id.toUpperCase() === want; })[0] || null;
}

/* --- toast --------------------------------------------------------------- */
var toastT;
function toast(msg, bad) {
  var el = $('#toast');
  el.textContent = msg;
  el.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastT);
  toastT = setTimeout(function () { el.className = ''; }, 4200);
}

/* --- tooltip ------------------------------------------------------------- */
var tip = $('#tip');
function showTip(evt, title, rows) {
  var kids = [h('div', { class: 'tt', text: title })];
  rows.forEach(function (r) {
    kids.push(h('div', { class: 'tr' }, [
      r.color ? h('i', { style: { background: r.color } }) : null,
      document.createTextNode(r.label), h('b', { text: String(r.value) })
    ]));
  });
  tip.innerHTML = ''; apply(tip, null, kids);
  tip.style.opacity = '1'; moveTip(evt);
}
function moveTip(evt) {
  var pad = 12, w = tip.offsetWidth, ht = tip.offsetHeight;
  var x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + ht > innerHeight - 8) y = evt.clientY - ht - pad;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = '0'; }
document.addEventListener('scroll', hideTip, true);

/* --- scales -------------------------------------------------------------- */
function niceTicks(max, want) {
  if (max <= 0) return [0];
  var raw = max / (want || 4);
  var mag = Math.pow(10, Math.floor(Math.log10(raw)));
  var step = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; })
    .filter(function (v) { return v >= raw; })[0] || 10 * mag;
  var out = [];
  for (var v = 0; v <= max + step * 0.001; v += step) out.push(Math.round(v));
  return out;
}
function barPath(x, y, w, ht, r) {
  r = Math.max(0, Math.min(r, w, ht / 2));
  return 'M' + x + ',' + y + 'H' + (x + w - r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r +
    'V' + (y + ht - r) + 'a' + r + ',' + r + ' 0 0 1 ' + (-r) + ',' + r + 'H' + x + 'Z';
}
function colPath(x, y, w, ht, r) {
  r = Math.max(0, Math.min(r, w / 2, ht));
  return 'M' + x + ',' + (y + ht) + 'V' + (y + r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + (-r) +
    'H' + (x + w - r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r + 'V' + (y + ht) + 'Z';
}

/* ===========================================================================
   Charts (Data view)
   =========================================================================== */
function drawProgress(host, data) {
  var series = data.series;
  host.innerHTML = '';
  if (series.length < 2) { host.appendChild(h('div', { class: 'empty', text: 'Not enough history yet.' })); return; }

  var W = Math.max(280, host.clientWidth), H = 232;
  var pad = { t: 14, r: 74, b: 26, l: 34 };
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  var t0 = series[0].ts, t1 = series[series.length - 1].ts;
  var maxY = Math.max.apply(null, series.map(function (p) { return p.total; }));
  var ticks = niceTicks(maxY, 4), top = ticks[ticks.length - 1];
  var X = function (ts) { return pad.l + (t1 === t0 ? iw : ((ts - t0) / (t1 - t0)) * iw); };
  var Y = function (v) { return pad.t + ih - (v / top) * ih; };

  var svg = s('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img',
    'aria-label': 'Line chart: total tracked tasks rose to ' + data.counts.total + ' and completed tasks to ' +
      data.counts.done + ' between ' + fDate(t0) + ' and ' + fDate(t1) + '.' });

  ticks.forEach(function (v) {
    svg.appendChild(s('line', { class: 'grid', x1: pad.l, x2: pad.l + iw, y1: Y(v), y2: Y(v) }));
    svg.appendChild(s('text', { class: 'tick', x: pad.l - 7, y: Y(v) + 3, 'text-anchor': 'end', text: v }));
  });
  svg.appendChild(s('line', { class: 'axis', x1: pad.l, x2: pad.l + iw, y1: Y(0), y2: Y(0) }));

  var days = Math.max(1, Math.round((t1 - t0) / 864e5));
  var stepD = Math.max(1, Math.ceil(days / Math.max(2, Math.floor(iw / 62))));
  var lastX = -Infinity;
  for (var d = 0; d <= days; d += stepD) {
    var ts = t0 + d * 864e5;
    if (X(ts) > pad.l + iw - 12) break;
    svg.appendChild(s('text', { class: 'tick', x: X(ts), y: H - 8, 'text-anchor': 'middle', text: fDay(ts) }));
    lastX = X(ts);
  }
  if (pad.l + iw - lastX >= 38) {
    svg.appendChild(s('text', { class: 'tick', x: pad.l + iw, y: H - 8, 'text-anchor': 'end', text: fDay(t1) }));
  }

  var cDone = cssVar('--done'), cOpen = cssVar('--open'), cSurf = cssVar('--surface-1');
  var line = function (key) { return series.map(function (p, i) { return (i ? 'L' : 'M') + X(p.ts) + ',' + Y(p[key]); }).join(''); };
  var band = line('total') + series.slice().reverse().map(function (p) { return 'L' + X(p.ts) + ',' + Y(p.done); }).join('') + 'Z';
  svg.appendChild(s('path', { d: band, fill: cOpen, 'fill-opacity': 0.10 }));
  svg.appendChild(s('path', { d: line('done') + 'L' + X(t1) + ',' + Y(0) + 'L' + X(t0) + ',' + Y(0) + 'Z', fill: cDone, 'fill-opacity': 0.10 }));
  svg.appendChild(s('path', { d: line('total'), fill: 'none', stroke: cOpen, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  svg.appendChild(s('path', { d: line('done'), fill: 'none', stroke: cDone, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

  var last = series[series.length - 1];
  var yT = Y(last.total), yD = Y(last.done);
  if (Math.abs(yT - yD) < 15) { var m = (yT + yD) / 2; yT = m - 8; yD = m + 8; }
  [[last.total, Y(last.total), yT, cOpen, 'Total'], [last.done, Y(last.done), yD, cDone, 'Done']].forEach(function (e) {
    svg.appendChild(s('circle', { cx: X(last.ts), cy: e[1], r: 4, fill: e[3], stroke: cSurf, 'stroke-width': 2 }));
    svg.appendChild(s('text', { class: 'lbl', x: X(last.ts) + 10, y: e[2] + 4, text: e[4] + ' ' + e[0] }));
  });

  var cross = s('line', { class: 'axis', y1: pad.t, y2: pad.t + ih, opacity: 0 });
  var dotT = s('circle', { r: 4, fill: cOpen, stroke: cSurf, 'stroke-width': 2, opacity: 0 });
  var dotD = s('circle', { r: 4, fill: cDone, stroke: cSurf, 'stroke-width': 2, opacity: 0 });
  svg.appendChild(cross); svg.appendChild(dotT); svg.appendChild(dotD);
  var hit = s('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent' });
  svg.appendChild(hit);
  hit.addEventListener('mousemove', function (ev) {
    var r = svg.getBoundingClientRect();
    var px = (ev.clientX - r.left) * (W / r.width);
    var want = t0 + ((px - pad.l) / iw) * (t1 - t0);
    var best = series[0], bd = Infinity;
    for (var i = 0; i < series.length; i++) {
      var dd = Math.abs(series[i].ts - want);
      if (dd < bd) { bd = dd; best = series[i]; }
    }
    cross.setAttribute('x1', X(best.ts)); cross.setAttribute('x2', X(best.ts)); cross.setAttribute('opacity', 1);
    dotT.setAttribute('cx', X(best.ts)); dotT.setAttribute('cy', Y(best.total)); dotT.setAttribute('opacity', 1);
    dotD.setAttribute('cx', X(best.ts)); dotD.setAttribute('cy', Y(best.done)); dotD.setAttribute('opacity', 1);
    showTip(ev, fDate(best.ts), [
      { color: cOpen, label: 'Total scope', value: best.total },
      { color: cDone, label: 'Done', value: best.done + ' (' + pct(best.done, best.total) + '%)' },
      { label: 'Open', value: best.open }
    ]);
  });
  hit.addEventListener('mouseleave', function () {
    hideTip(); cross.setAttribute('opacity', 0); dotT.setAttribute('opacity', 0); dotD.setAttribute('opacity', 0);
  });

  host.appendChild(svg);
  host.appendChild(h('div', { class: 'legend' }, [
    h('span', null, [h('i', { style: { background: cOpen } }), 'Total scope']),
    h('span', null, [h('i', { style: { background: cDone } }), 'Done']),
    h('span', { style: { color: 'var(--muted)' }, text: 'shaded band = open work' })
  ]));
}

function drawDaily(host, data) {
  var days = data.daily;
  host.innerHTML = '';
  if (!days.length) { host.appendChild(h('div', { class: 'empty', text: 'No completions recorded yet.' })); return; }
  var W = Math.max(280, host.clientWidth), H = 150;
  var pad = { t: 16, r: 6, b: 24, l: 30 };
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  var maxY = Math.max.apply(null, days.map(function (d) { return d.count; }));
  var ticks = niceTicks(Math.max(1, maxY), 3), top = ticks[ticks.length - 1];
  var slot = iw / days.length, bw = Math.max(2, Math.min(24, slot - 3));
  var cDone = cssVar('--done');

  var svg = s('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img',
    'aria-label': 'Column chart of tasks completed per day, ' + days.length + ' days ending ' +
      fDate(days[days.length - 1].ts) + '. Busiest day: ' + maxY + '.' });
  ticks.forEach(function (v) {
    var y = pad.t + ih - (v / top) * ih;
    svg.appendChild(s('line', { class: 'grid', x1: pad.l, x2: pad.l + iw, y1: y, y2: y }));
    svg.appendChild(s('text', { class: 'tick', x: pad.l - 7, y: y + 3, 'text-anchor': 'end', text: v }));
  });
  svg.appendChild(s('line', { class: 'axis', x1: pad.l, x2: pad.l + iw, y1: pad.t + ih, y2: pad.t + ih }));

  var peak = days.reduce(function (a, b) { return b.count >= a.count ? b : a; }, days[0]);
  var everyN = Math.max(1, Math.ceil(days.length / Math.max(2, Math.floor(iw / 54))));
  days.forEach(function (d, i) {
    var x = pad.l + i * slot + (slot - bw) / 2, ht = (d.count / top) * ih;
    if (d.count > 0 && ht >= 1) svg.appendChild(s('path', { d: colPath(x, pad.t + ih - ht, bw, ht, 3), fill: cDone }));
    var hit = s('rect', { x: pad.l + i * slot, y: pad.t, width: slot, height: ih, fill: 'transparent' });
    hit.addEventListener('mousemove', function (ev) { showTip(ev, fDate(d.ts), [{ color: cDone, label: 'Completed', value: d.count }]); });
    hit.addEventListener('mouseleave', hideTip);
    svg.appendChild(hit);
    if (i % everyN === 0) svg.appendChild(s('text', { class: 'tick', x: pad.l + i * slot + slot / 2, y: H - 8, 'text-anchor': 'middle', text: fDay(d.ts) }));
  });
  if (peak.count > 0) {
    var pi = days.indexOf(peak);
    svg.appendChild(s('text', { class: 'lbl', x: pad.l + pi * slot + slot / 2, y: pad.t + ih - (peak.count / top) * ih - 5, 'text-anchor': 'middle', text: peak.count }));
  }
  host.appendChild(svg);
}

/* Replaced "by phase" (2026-08-04): phases carried no information anybody used.
   How much OPEN work sits in each severity band is the question the queue
   actually raises. */
var PRI_COLOR = { P0: '--critical', P1: '--warning', P2: '--open', untriaged: '--muted' };
var PRI_LABEL = { P0: 'P0 severe', P1: 'P1 feature + polish', P2: 'P2 infra', untriaged: 'Untriaged' };
function drawPriorities(host, data) {
  var rows = (data.priorities || []).filter(function (r) { return r.open > 0; });
  host.innerHTML = '';
  if (!rows.length) { host.appendChild(h('div', { class: 'empty', text: 'No open work.' })); return; }

  var W = Math.max(280, host.clientWidth);
  var labW = 34, valW = 48, rowH = 26, barH = 14;
  var iw = Math.max(60, W - labW - valW), H = rows.length * rowH + 4;
  var maxT = Math.max.apply(null, rows.map(function (r) { return r.open; }));

  var svg = s('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img',
    'aria-label': 'Open tasks in each priority band.' });
  rows.forEach(function (r, i) {
    var y = i * rowH + 4, cy = y + barH / 2;
    var col = cssVar(PRI_COLOR[r.priority] || '--muted');
    svg.appendChild(s('text', { x: 0, y: cy + 4, class: 'lbl', text: r.priority === 'untriaged' ? '--' : r.priority }));
    var w = (r.open / maxT) * iw;
    if (w >= 1.5) svg.appendChild(s('path', { d: barPath(labW, y, w, barH, 4), fill: col }));
    svg.appendChild(s('text', { x: labW + w + 8, y: cy + 4, class: 'tick', text: String(r.open) }));
    var hit = s('rect', { x: 0, y: y - 4, width: W, height: rowH, fill: 'transparent' });
    hit.addEventListener('mousemove', function (ev) {
      showTip(ev, PRI_LABEL[r.priority] || r.priority, [{ color: col, label: 'Open', value: r.open }]);
    });
    hit.addEventListener('mouseleave', hideTip);
    svg.appendChild(hit);
  });
  host.appendChild(svg);
}

function tableView(summary, headers, rows) {
  return h('details', { class: 'tv' }, [
    h('summary', { text: summary }),
    h('div', { class: 'tv-wrap' }, [h('table', null, [
      h('thead', null, [h('tr', null, headers.map(function (x, i) { return h('th', { class: i ? 'num' : '', text: x }); }))]),
      h('tbody', null, rows.map(function (r) { return h('tr', null, r.map(function (c, i) { return h('td', { class: i ? 'num' : '', text: c }); })); }))
    ])])
  ]);
}
function card(title, sub, body) {
  return h('section', { class: 'card' }, [h('h2', { text: title }), sub ? h('div', { class: 'sub', text: sub }) : null].concat(body));
}

/* ===========================================================================
   ACTIVITY view — what needs a call, then what has happened
   =========================================================================== */
function post(url, body) {
  return fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().then(function (j) {
      if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}

function resolveDecision(d, answerKey) {
  if (state.busy) return;
  var note = (state.notes[d.id] || '').trim();
  if (!answerKey && !note) { toast('Pick an option, or write a note saying what to do instead.', true); return; }
  state.busy = true;
  post('api/resolve', { id: d.id, answer: answerKey, note: note })
    .then(function () {
      delete state.notes[d.id];
      toast(d.id + ' resolved' + (d.task ? ' and folded into ' + d.task : '') + '.');
      return refresh(true);
    })
    .catch(function (e) { toast('Could not resolve ' + d.id + ': ' + e.message, true); })
    .finally(function () { state.busy = false; });
}

/** "Label (Recommended)" -> { text, recommended } — the flag renders as a chip, not prose. */
function splitRecommended(label) {
  var m = /^(.*?)\s*\((recommended)\)\s*$/i.exec(label || '');
  return m ? { text: m[1], recommended: true } : { text: label || '', recommended: false };
}

function pcList(title, items, cls) {
  return h('div', { class: 'pc ' + cls }, [
    h('div', { class: 'pc-head', text: title }),
    h('ul', { class: 'pc-list' }, items.map(function (x) { return h('li', { text: x }); }))
  ]);
}

/** An option's body: structured pros/cons/mitigation lists, or legacy detail prose. */
function optionBody(o) {
  var out = [];
  if (o.detail) out.push(h('span', { text: o.detail }));
  var cols = [];
  if (o.pros && o.pros.length) cols.push(pcList('Pros', o.pros, 'pros'));
  if (o.cons && o.cons.length) cols.push(pcList('Cons', o.cons, 'cons'));
  if (cols.length) out.push(h('div', { class: 'pc-grid' }, cols));
  if (o.mitigation && o.mitigation.length) out.push(pcList('To reduce the cons', o.mitigation, 'mit'));
  return out;
}

function decisionCard(d) {
  // Recommended first, whatever order the file has (user directive, 2026-08-05).
  var ordered = d.options.slice().sort(function (a, b) {
    return (splitRecommended(a.label).recommended ? 0 : 1) - (splitRecommended(b.label).recommended ? 0 : 1);
  });
  var opts = h('div', { class: 'opts' }, ordered.map(function (o, i) {
    var lab = splitRecommended(o.label);
    return h('button', {
      class: 'opt' + (lab.recommended ? ' recommended' : ''), type: 'button',
      'data-anim-key': 'opt:' + d.id + ':' + o.key,
      onclick: function () { resolveDecision(d, o.key); }
    }, [
      h('b', null, [
        (i + 1) + '. ' + lab.text,
        lab.recommended ? h('span', { class: 'chip rec', text: 'Recommended' }) : null
      ])
    ].concat(optionBody(o)));
  }));
  var ta = h('textarea', {
    placeholder: 'Or say what to do instead…', rows: 1,
    'aria-label': 'Resolution note for ' + d.id,
    oninput: function (e) { state.notes[d.id] = e.target.value; }
  });
  ta.value = state.notes[d.id] || '';
  return h('div', { class: 'dec', 'data-anim-key': 'dec:' + d.id }, [
    h('div', { class: 'dec-top' }, [
      h('span', { class: 'dec-id', text: d.id }),
      h('span', { class: 'dec-title', text: d.title }),
      d.task ? h('span', { class: 'chip link', title: 'Show this task', text: d.task,
        onclick: function () { state.filters = { q: d.task, statuses: null, priority: '', seat: '', tag: '' }; go('tasks'); } }) : null,
      h('span', { class: 'chip', text: d.kind })
    ]),
    d.why ? h('div', { class: 'dec-why', text: d.why }) : null,
    d.assumed ? h('div', { class: 'dec-assumed' }, [
      h('b', { text: 'Proceeding meanwhile with: ' }), d.assumed,
      h('div', { style: { marginTop: '3px' }, text: 'Nothing is blocked — this only changes what happens next.' })
    ]) : null,
    d.options.length ? opts : null,
    h('div', { class: 'dec-note' }, [
      ta,
      h('button', { class: 'btn', type: 'button', text: 'Resolve with note',
        onclick: function () { resolveDecision(d, null); } })
    ])
  ]);
}

// `label` is both the toast text and — since T564 — the receipt written into
// the task's own progress log, so a later reader can tell which button moved it.
function setStatus(t, status, label) {
  if (state.busy) return;
  state.busy = true;
  post('api/status', { id: t.id, status: status, source: label })
    .then(function () { toast(t.id + ' ' + label + '.'); return refresh(true); })
    .catch(function (e) { toast('Could not update ' + t.id + ': ' + e.message, true); })
    .finally(function () { state.busy = false; });
}

function copyBtn(text, label) {
  return h('button', { class: 'btn', type: 'button', text: label || 'Copy command',
    onclick: function (e) {
      var done = function () { toast('Command copied.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { toast('Could not copy — select it by hand.', true); });
      } else {
        // http://localhost is a secure context in Chromium, but keep a path
        // for the case where it is not rather than failing silently.
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (x) { toast('Could not copy.', true); }
        document.body.removeChild(ta);
      }
    } });
}

/**
 * Is the thing that restarts the loop itself alive? (T440.)
 *
 * This row is here even when everything is fine, and deliberately so: the
 * failure it reports is thirteen hours of nothing happening, and a supervisor
 * that only appears once it is missing is a supervisor nobody knows to look
 * for. The healthy case is one quiet line.
 */
function watchdogRows(d) {
  var W = d.watchdog;
  if (!W) return [];   // an older server that does not report it yet
  if (W.running) {
    return [h('div', { class: 'loop-task muted',
      text: 'Supervisor: watching (last check ' + (W.tickAgeMs == null ? '?' : fDur(W.tickAgeMs)) + ' ago).' })];
  }
  var why = !W.present
    ? 'The watchdog has never checked in on this box.'
    : 'The watchdog last checked in ' + (W.tickAgeMs == null ? 'at an unreadable time' : fDur(W.tickAgeMs) + ' ago') + ' and is not running now.';
  return [
    h('div', { class: 'loop-line' }, [
      h('span', { class: 'dot-live stale' }),
      h('b', { text: 'Supervisor is down' })
    ]),
    h('div', { class: 'loop-task muted',
      text: why + ' Nothing will restart the loop if it stops. Re-installing also registers the every-10-minute revival task, so this cannot go unnoticed for a day again.' }),
    h('div', { class: 'dec-note' }, [copyBtn('powershell -NoProfile -File scripts\\go-loop-watchdog.ps1 -Install')])
  ];
}

/** What the loop is doing right now — or that it has stopped. */
function loopCard(d) {
  var L = d.loop;
  if (!L) {
    return card('The loop', null, [h('div', { class: 'empty',
      text: 'No lock file — the go-loop is not running. Start it in a Ghoztty pane with: read go.md and go' })].concat(watchdogRows(d)));
  }
  var inflight = d.tasks.filter(function (t) { return t.bucket === 'in_progress' && !t.stale; });
  var age = L.heartbeatAgeMs == null ? '?' : fDur(L.heartbeatAgeMs);
  var rows = [
    h('div', { class: 'loop-line' }, [
      h('span', { class: 'dot-live' + (L.running ? '' : ' stale') }),
      h('b', { text: L.running ? (L.checkpointStale ? 'Running — long turn' : 'Running') : 'Not running' }),
      h('span', { class: 'chip', text: 'turn ' + L.turn }),
      h('span', { class: 'chip', text: 'last checkpoint ' + age + ' ago' })
    ])
  ];
  if (inflight.length) {
    rows.push(h('div', { class: 'loop-task' }, ['Working on ', h('b', { text: inflight[0].id }), ' — ' + inflight[0].title]));
  } else if (L.running) {
    // Straight about the gap rather than implying idleness: the loop does not
    // record what it picked up, so "nothing marked" is not "nothing happening".
    rows.push(h('div', { class: 'loop-task muted',
      text: 'The loop is alive but no task is marked in progress, so this card cannot name it. go.md step 1 now asks the loop to mark a task when it picks it up; turns that started before that rule stay invisible here.' }));
  }
  if (L.running && L.checkpointStale) {
    rows.push(h('div', { class: 'loop-task muted',
      text: 'The lock is only refreshed at task boundaries, so ' + age + ' without one means a long turn, not a dead loop — the process is alive. Past 45 minutes the watchdog may re-enter anyway.' }));
  }
  if (!L.running) {
    rows.push(h('div', { class: 'loop-task muted',
      text: 'The claude process named in the lock is gone, and the pane it owned is not running one either — so this is a stopped loop rather than a session that was relaunched under a new pid. Check which windows are marked, then re-enter the loop from a Ghoztty pane.' }));
    rows.push(h('div', { class: 'dec-note' }, [copyBtn('powershell -NoProfile -File scripts\\go-loop-exec.ps1 list')]));
  }
  rows = rows.concat(watchdogRows(d));
  return card('The loop', null, rows);
}

/** Goals as a read-only checklist, with how far along it is. */
function goalList(t) {
  var done = t.goals.filter(function (g) { return g.done; }).length;
  return h('div', { class: 'goals' }, [
    h('div', { class: 'goals-head', text: 'Goals — ' + done + ' of ' + t.goals.length + ' done' })
  ].concat(t.goals.map(function (g) {
    return h('div', { class: 'goal' + (g.done ? ' done' : '') }, [
      h('span', { class: 'box', 'aria-hidden': 'true', text: g.done ? '✓' : '' }),
      h('span', { text: g.text })
    ]);
  })));
}

function inflightRow(t) {
  var kids = [
    h('div', { class: 'if-head' }, [
      h('span', { class: 'dec-id', text: t.id }),
      h('span', { class: 'pill in_progress' }, [h('i'), 'In progress']),
      t.statusSince ? h('span', { class: 'chip', title: 'Since ' + fDate(t.statusSince) + ' ' + fTime(t.statusSince),
        text: 'in flight ' + fDur(Date.now() - t.statusSince) }) : null,
      t.stale ? h('span', { class: 'chip warn', text: 'stale — untouched ' + fDur(t.staleMs) } ) : null
    ].concat(tagChips(t.tags))),
    h('div', {
      class: 'if-title ev-link', text: t.title, role: 'button', tabindex: '0',
      onclick: function () { openTask(t); },
      onkeydown: function (e) { if (e.key === 'Enter') openTask(t); }
    })
  ];
  if (t.plain) {
    kids.push(h('div', { class: 'if-plain', text: t.plain }));
  } else if (!t.stale) {
    // Show the raw summary rather than nothing, but say what it is — a
    // silent fallback would let the missing plain-language section look like
    // the intended output, and it would never get written.
    if (t.summary) kids.push(h('div', { class: 'if-plain muted', text: t.summary }));
    kids.push(h('div', { class: 'if-note',
      text: 'No plain-language summary yet. go.md step 1 asks the loop to write an “In plain terms” section when it claims a task.' }));
  }
  if (t.goals && t.goals.length) kids.push(goalList(t));
  // The run so far, from the task's progress log — what a watcher (or the
  // next turn, after a crash) reads to know where the work actually is.
  if (t.progress && t.progress.length) {
    kids.push(h('div', { class: 'goals' }, [h('div', { class: 'goals-head', text: 'Run log' })]
      .concat(t.progress.slice(-3).map(function (p) {
        return h('div', { class: 'prog-line' }, [
          p.ts ? h('span', { class: 'prog-ts', text: fDay(p.ts) + ' ' + fTime(p.ts) }) : null,
          h('span', { text: p.text })
        ]);
      }))));
  }
  if (t.stale) {
    kids.push(h('div', { class: 'att-why',
      text: 'Marked in progress but its file has not changed in ' + fDur(t.staleMs) +
        '. Almost certainly abandoned rather than active — resetting it puts it back in the queue.' }));
    kids.push(h('div', { class: 'dec-note' }, [
      h('button', { class: 'btn', type: 'button', text: 'Reset to to-do',
        onclick: function () { setStatus(t, 'todo', 'reset to to-do'); } })
    ]));
  }
  return h('div', { class: 'att-row in_progress', 'data-anim-key': 'inf:' + t.id }, [h('i', { class: 'bar' }), h('div', null, kids)]);
}

/** A blocked task with the step that unblocks it — never a dead end. */
function blockedCard(t) {
  // An armed watch waits on an EVENT (a crash recurring), not on a chore. It
  // gets a card that states the condition and offers no call to action, because
  // the only thing anyone could press cannot bring the event about — see
  // blockedOnOf() in task-dashboard.js for the two reopen/re-park round trips
  // that motivated the split.
  var watching = t.blockedOn === 'event';
  var kids = [
    h('div', { class: 'dec-top' }, [
      h('span', { class: 'dec-id', text: t.id }),
      h('span', { class: 'dec-title', text: t.title }),
      watching
        ? h('span', { class: 'chip', text: 'Armed watch' })
        : h('span', { class: 'pill blocked' }, [h('i'), 'Blocked']),
      t.statusSince ? h('span', { class: 'chip warn', title: 'Since ' + fDate(t.statusSince) + ' ' + fTime(t.statusSince),
        text: (watching ? 'watching ' : 'blocked ') + fDur(Date.now() - t.statusSince) }) : null
    ])
  ];
  if (t.reason) kids.push(h('div', { class: 'dec-assumed' }, [h('b', { text: 'Why: ' }), t.reason]));
  if (t.unblock) {
    kids.push(h('div', { class: 'dec-why' }, [
      h('b', { text: watching ? 'Fires when: ' : 'To unblock: ' }), t.unblock]));
  } else {
    kids.push(h('div', { class: 'dec-why muted',
      text: 'No unblock steps recorded. Add an `unblock:` line to ' + t.file + ' so this is actionable next time.' }));
  }
  var actions = [];
  // The command that DOES the work outranks the one that records it. Showing
  // only the status flip is what made T857 look like a one-click job when the
  // real blocker was two elevated powercfg lines the user could not even see.
  if (t.unblockDo) {
    kids.push(h('pre', { class: 'cmd', text: t.unblockDo }));
    actions.push(copyBtn(t.unblockDo, 'Copy the commands'));
  }
  if (t.unblockCommand) kids.push(h('pre', { class: 'cmd', text: t.unblockCommand }));
  if (t.unblockCommand) actions.push(copyBtn(t.unblockCommand, t.unblockDo ? 'Copy the follow-up' : 'Copy command'));
  // Two-step, because a blocked task's `unblock:` line usually names a
  // CONDITION rather than a chore ("a new occurrence…"), and one stray click
  // used to put such a task back at the head of the queue with nothing
  // recorded — which cost a turn on T443 twice (T564). Arming re-reads the
  // condition back at whoever is about to override it. A second click still
  // does it: this is a speed bump, not a lock. No confirm() dialog on purpose —
  // a modal inside the viewer pane blocks the whole WebView.
  var armed = false;
  // An armed watch's control is deliberately NOT the primary action: on that
  // card the honest answer to "what do I do?" is "nothing, wait". It stays
  // reachable so a human who knows better can still override the loop, which
  // is the escape hatch D27 promised when it chose the re-park rule.
  var unblockBtn = h('button', { class: watching ? 'btn' : 'btn primary', type: 'button',
    text: watching ? 'Reopen anyway' : 'Mark unblocked',
    onclick: function () {
      if (!armed && t.unblock) {
        armed = true;
        unblockBtn.textContent = 'Yes - reopen it anyway';
        unblockBtn.classList.add('danger');
        toast(t.id + (watching ? ' stays parked until: ' : ' is blocked until: ') + t.unblock, true);
        return;
      }
      setStatus(t, 'todo', 'is unblocked and back in the queue');
    } });
  actions.push(unblockBtn);
  kids.push(h('div', { class: 'dec-note' }, actions));
  return h('div', { class: 'dec blocked-dec', 'data-anim-key': 'blk:' + t.id }, kids);
}

function activityView(d) {
  var out = [];
  var open = d.decisions.filter(function (x) { return x.status !== 'resolved'; });

  var decHead = [
    h('h2', { text: open.length ? 'Needs your call' : 'Nothing needs your call' }),
    h('div', { class: 'sub', text: open.length
      ? 'The loop made these calls and kept going. Confirm one, or pick the other option and it folds back into the task.'
      : 'The loop files a decision here whenever it makes a judgement call you might want to overturn.' })
  ];
  var decBody = open.length ? open.map(decisionCard) : [h('div', { class: 'empty', text: 'No open decisions.' })];
  out.push(h('section', { class: 'card', 'data-anim-key': 'card:decisions' }, decHead.concat(decBody)));

  var lc = loopCard(d);
  lc.setAttribute('data-anim-key', 'card:loop');
  out.push(lc);

  var inflight = d.tasks.filter(function (t) { return t.bucket === 'in_progress'; });
  if (inflight.length) {
    var ic = card('In flight', 'Tasks marked in progress. The loop marks one when it picks it up and clears it when it lands.',
      [h('div', { class: 'att' }, inflight.map(inflightRow))]);
    ic.setAttribute('data-anim-key', 'card:inflight');
    out.push(ic);
  }

  var blocked = d.tasks.filter(function (t) { return t.bucket === 'blocked'; });
  var needsYou = blocked.filter(function (t) { return t.blockedOn !== 'event'; });
  var watching = blocked.filter(function (t) { return t.blockedOn === 'event'; });
  if (needsYou.length) {
    var bc = card('Blocked — needs you', 'Each one says what unblocks it. Do the step, then mark it to-do so the loop can pick it up.',
      needsYou.map(blockedCard));
    bc.setAttribute('data-anim-key', 'card:blocked');
    out.push(bc);
  }
  if (watching.length) {
    var wc = card('Armed watch — waiting on an event',
      'Nothing to do here. These are parked until something happens on its own (a crash recurs, a lane goes red); the loop re-arms them and reopens them itself when it does.',
      watching.map(blockedCard));
    wc.setAttribute('data-anim-key', 'card:watching');
    out.push(wc);
  }

  // Timeline
  var items = d.activity.slice(0, state.shown);
  var body = [];
  var lastDay = null;
  items.forEach(function (a) {
    var k = dayKey(a.ts);
    if (k !== lastDay) { lastDay = k; body.push(h('div', { class: 'day', text: dayLabel(a.ts) })); }
    var cls = 'ev ' + a.kind + (a.kind === 'work' && !a.completed.length ? ' filed' : '');
    var meta = [h('span', { text: fTime(a.ts) }), h('span', { text: fAgo(a.ts) })];
    if (a.durationMs != null) meta.push(h('span', { text: 'took ' + fDur(a.durationMs) }));
    if (a.sha) meta.push(h('span', { text: a.sha }));

    // A task chip opens the L2 task view — the card is the headline, the
    // dialog is the full story (goals, run log, validation, related work).
    var taskChip = function (c) {
      var t = taskById(c.id);
      return h('span', {
        class: 'chip' + (t ? ' link' : ''), title: c.title,
        text: c.id,
        onclick: t ? function (e) { e.stopPropagation(); openTask(t); } : null
      });
    };
    var chips = [];
    if (a.completed.length) {
      chips.push(h('span', { class: 'lab', text: 'completed' }));
      a.completed.forEach(function (c) { chips.push(taskChip(c)); });
    }
    if (a.filed.length) {
      chips.push(h('span', { class: 'lab', text: 'follow-ups filed' }));
      a.filed.forEach(function (c) { chips.push(taskChip(c)); });
    }
    tagChips(a.tags).forEach(function (c) { chips.push(c); });
    // The whole card opens the event's own L2 (T505); task chips inside it
    // stopPropagation and open their task directly, as before.
    body.push(h('div', {
      class: cls, role: 'button', tabindex: '0',
      'data-anim-key': 'ev:' + (a.sha || (a.kind + ':' + (a.decision || '') + ':' + a.ts)),
      onclick: function () { openEvent(a); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEvent(a); } }
    }, [
      h('div', { class: 'ev-rail' }, [h('div', { class: 'ev-dot' })]),
      h('div', { class: 'ev-body' }, [
        h('div', { class: 'ev-title', text: a.title }),
        h('div', { class: 'ev-meta' }, meta),
        a.summary ? h('div', { class: 'ev-sum', text: a.summary }) : null,
        chips.length ? h('div', { class: 'ev-chips' }, chips) : null
      ])
    ]));
  });
  if (state.shown < d.activity.length) {
    body.push(h('div', { class: 'more' }, [
      h('button', { class: 'btn', type: 'button', text: 'Show ' + Math.min(PAGE_SIZE, d.activity.length - state.shown) + ' more',
        onclick: function () { state.shown += PAGE_SIZE; renderView(); } })
    ]));
  }
  out.push(card('Timeline', d.activity.length + ' events since ' + fDate(d.historyStart) +
    ' — each one is a commit that finished or filed work.', body.length ? body : [h('div', { class: 'empty', text: 'No activity yet.' })]));
  return out;
}

/* --- event detail dialog (T505) -------------------------------------------
   The timeline card is the headline; this dialog is the event's own L2: the
   full commit message, every task it finished or filed, tags, timing. Same
   <dialog> idiom as openTask. Task links open the task dialog ON TOP rather
   than closing this one, so closing the task drops you back on the event and
   closing the event drops you back on the Activity view, scroll untouched. */
function openEvent(a) {
  var kindCls = a.kind + (a.kind === 'work' && !a.completed.length ? ' filed' : '');
  var kindLabel = a.kind === 'work' ? (a.completed.length ? 'Work landed' : 'Work filed')
    : a.kind === 'decision-opened' ? 'Decision opened'
    : a.kind === 'decision-resolved' ? 'Decision resolved' : 'Event';
  var jump = function (id) {
    var t = taskById(id);
    if (t) openTask(t);
  };
  var taskRow = function (c) {
    var t = taskById(c.id);
    return h('div', { class: 'evd-task' }, [
      h('span', {
        class: 'chip' + (t ? ' link' : ''), text: c.id,
        onclick: t ? function () { openTask(t); } : null
      }),
      h('span', { text: c.title || (t ? t.title : '') })
    ]);
  };
  var body = h('div', { class: 'td-body' });
  // Work events fetch the whole commit message below, whose first paragraph
  // IS the summary — repeating it above would say everything twice.
  var willFetchMsg = a.kind === 'work' && a.sha;
  if (a.summary && !willFetchMsg) body.appendChild(h('div', { class: 'evd-sum', text: a.summary }));
  if (a.completed.length) {
    body.appendChild(h('div', { class: 'evd-sec' },
      [h('div', { class: 'goals-head', text: 'Completed' })].concat(a.completed.map(taskRow))));
  }
  if (a.filed.length) {
    body.appendChild(h('div', { class: 'evd-sec' },
      [h('div', { class: 'goals-head', text: 'Follow-ups filed' })].concat(a.filed.map(taskRow))));
  }
  // The decision events carry a task id but no chips of their own.
  if (a.task && taskById(a.task)) {
    body.appendChild(h('div', { class: 'evd-sec' },
      [h('div', { class: 'goals-head', text: 'Task' }), taskRow({ id: a.task, title: '' })]));
  }
  if (a.kind === 'work' && a.sha) {
    var msg = h('div', { class: 'md', text: 'Loading…' });
    body.appendChild(h('div', { class: 'evd-sec' },
      [h('div', { class: 'goals-head', text: 'Commit message' }), msg]));
    fetch('/api/commit?sha=' + encodeURIComponent(a.sha))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error) throw new Error(j.error);
        msg.textContent = '';
        var md = mdRender(j.body);
        linkifyTaskIds(md, jump);
        msg.appendChild(md);
      })
      .catch(function (e) {
        // The summary was withheld above in favor of this fetch — on failure
        // it is the best available story, so show it with the error under it.
        msg.textContent = '';
        if (a.summary) msg.appendChild(h('div', { class: 'evd-sum', text: a.summary }));
        msg.appendChild(h('div', { class: 'empty evd-err', text: 'Could not load the full message: ' + e.message }));
      });
  }
  var meta = [
    metaBit('When', fDate(a.ts) + ' ' + fTime(a.ts) + ' (' + fAgo(a.ts) + ')'),
    a.durationMs != null ? metaBit('Took', fDur(a.durationMs)) : null,
    a.sha ? metaBit('Commit', a.sha) : null,
    a.decision ? metaBit('Decision', a.decision) : null
  ];
  var dlg = h('dialog', { class: 'taskdlg' }, [
    h('header', null, [
      h('div', { class: 'td-head' }, [
        h('span', { class: 'evk ' + kindCls }, [h('i'), kindLabel]),
        a.sha ? h('code', { class: 'td-id', text: a.sha }) : null
      ].concat(tagChips(a.tags))),
      h('button', { class: 'td-x', 'aria-label': 'Close', text: '×', onclick: function () { dlg.close(); } })
    ]),
    h('h3', { class: 'td-title', text: a.title }),
    h('div', { class: 'td-meta' }, meta),
    body,
    a.decision ? h('footer', null, [h('code', { class: 'td-path', text: 'docs/design/windows-parity-decisions/' + a.decision + '.md' })]) : null
  ]);
  document.body.appendChild(dlg);
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', function () { dlg.remove(); });
  dlg.showModal();
}

/* ===========================================================================
   DAILY DIGEST view — one reflective write-up per day, from the loop's 5am
   step. Markdown is rendered by the tiny renderer below (textContent-based,
   never innerHTML) because the digest is prose meant to be READ, and the
   preformatted-monospace treatment the task dialog uses reads as a log.
   =========================================================================== */
function mdInline(sText) {
  var out = [];
  var re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*\s][^*]*\*)|(\[([^\]]+)\]\((https?:\/\/[^)\s]+)\))/g;
  var last = 0, m;
  var str = String(sText || '');
  while ((m = re.exec(str))) {
    if (m.index > last) out.push(document.createTextNode(str.slice(last, m.index)));
    if (m[1]) out.push(h('code', { text: m[1].slice(1, -1) }));
    else if (m[2]) out.push(h('b', { text: m[2].slice(2, -2) }));
    else if (m[3]) out.push(h('i', { text: m[3].slice(1, -1) }));
    else if (m[4]) out.push(h('a', { href: m[6], target: '_blank', rel: 'noopener', text: m[5] }));
    last = re.lastIndex;
  }
  if (last < str.length) out.push(document.createTextNode(str.slice(last)));
  return out;
}

function mdRender(text) {
  var root = h('div', { class: 'md' });
  var lines = String(text || '').split(/\r?\n/);
  var i = 0;
  var isList = function (l) { return /^\s*([-*]|\d+\.)\s+/.test(l); };
  var isHead = function (l) { return /^#{1,4}\s+/.test(l); };
  var isRule = function (l) { return /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l); };
  while (i < lines.length) {
    var line = lines[i];
    if (!line.trim()) { i++; continue; }
    // Fenced code: verbatim until the closing fence, never re-parsed. Task
    // bodies are full of command blocks and log excerpts; feeding those to
    // the list/paragraph rules turns a PowerShell one-liner into soup.
    if (/^\s*```/.test(line)) {
      var code = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++; // the closing fence (or EOF)
      root.appendChild(h('pre', { class: 'code' }, [h('code', { text: code.join('\n') })]));
      continue;
    }
    var m = /^(#{1,4})\s+(.*)$/.exec(line);
    if (m) { root.appendChild(h('h' + m[1].length, null, mdInline(m[2]))); i++; continue; }
    if (isRule(line)) { root.appendChild(h('hr')); i++; continue; }
    if (/^\s*>\s?/.test(line)) {
      var q = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      var inner = mdRender(q.join('\n'));
      var bq = h('blockquote');
      while (inner.firstChild) bq.appendChild(inner.firstChild);
      root.appendChild(bq);
      continue;
    }
    if (isList(line)) {
      var list = h(/^\s*\d+\./.test(line) ? 'ol' : 'ul');
      while (i < lines.length && isList(lines[i])) {
        // A hard-wrapped item continues on the following lines until a blank
        // line or a new block — fold them in (lazy continuation), or every
        // wrapped bullet sheds its tail into a stray paragraph.
        var item = [lines[i].replace(/^\s*([-*]|\d+\.)\s+/, '')];
        i++;
        while (i < lines.length && lines[i].trim() && !isList(lines[i]) &&
               !isHead(lines[i]) && !isRule(lines[i]) && !/^\s*>/.test(lines[i])) {
          item.push(lines[i].trim());
          i++;
        }
        var joined = item.join(' ');
        // A task-list item renders its checkbox as a real box, not "[x]"
        // prose — this is what makes goals and validation criteria readable.
        var cb = /^\[([ xX])\]\s+(.*)$/.exec(joined);
        if (cb) {
          list.appendChild(h('li', { class: 'task' + (cb[1] !== ' ' ? ' done' : '') }, [
            h('span', { class: 'cbox', 'aria-hidden': 'true', text: cb[1] !== ' ' ? '✓' : '' }),
            h('span', null, mdInline(cb[2]))
          ]));
        } else {
          list.appendChild(h('li', null, mdInline(joined)));
        }
      }
      root.appendChild(list);
      continue;
    }
    var p = [];
    while (i < lines.length && lines[i].trim() && !isHead(lines[i]) && !isList(lines[i]) &&
           !/^\s*>/.test(lines[i]) && !isRule(lines[i])) { p.push(lines[i]); i++; }
    root.appendChild(h('p', null, mdInline(p.join(' '))));
  }
  return root;
}

/* A digest body has CATEGORIES (2026-08-06): `## Commentary` (the prose
   morning read) and `## Task triage` (what the daily triage did). Split the
   body at those H2s; anything before the first category — or a whole
   pre-category digest — is Commentary. A leading `# …` H1 is dropped: the
   view renders its own date header. */
function splitDigestCategories(bodyText) {
  var lines = String(bodyText || '').split(/\r?\n/);
  var cats = [];
  var curName = 'Commentary';
  var buf = [];
  var known = { commentary: 'Commentary', 'task triage': 'Task triage', 'feature ideas': 'Feature ideas' };
  var flush = function () {
    var text = buf.join('\n').trim();
    if (!text) { buf = []; return; }
    var hit = null;
    for (var i = 0; i < cats.length; i++) if (cats[i].name === curName) hit = cats[i];
    if (hit) hit.text += '\n\n' + text; else cats.push({ name: curName, text: text });
    buf = [];
  };
  for (var i = 0; i < lines.length; i++) {
    var m = /^##\s+(.+?)\s*$/.exec(lines[i]);
    var kn = m && known[m[1].toLowerCase()];
    if (kn) { flush(); curName = kn; continue; }
    if (/^#\s+/.test(lines[i]) && !buf.join('').trim() && cats.length === 0) continue;
    buf.push(lines[i]);
  }
  flush();
  return cats.length ? cats : [{ name: 'Commentary', text: '' }];
}

/* "2026-08-06" -> "Wednesday, August 6, 2026" (local, midday to dodge TZ). */
function digestDateLabel(dateStr) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  if (!m) return dateStr || '';
  var dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12);
  var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];
  return days[dt.getDay()] + ', ' + months[dt.getMonth()] + ' ' + dt.getDate() + ', ' + dt.getFullYear();
}

function digestView(d) {
  var dates = d.digests || [];
  if (!dates.length) {
    return [card('Daily digest', null, [h('div', { class: 'empty',
      text: 'No digest yet. Each morning at 5am the loop writes one — what happened yesterday, the focus for today, and a step-back reflection on how the work is going. The first one appears here once written.' })])];
  }
  var cur = state.digestDate && dates.indexOf(state.digestDate) >= 0 ? state.digestDate : dates[0];
  if (d.digest && d.digest.body != null) state.digestCache[d.digest.date] = d.digest.body;
  var body = h('div', { class: 'digest-body' });
  var cached = state.digestCache[cur];
  var tabsRow = null;
  if (cached != null) {
    var cats = splitDigestCategories(cached);
    var names = cats.map(function (c) { return c.name; });
    var curTab = names.indexOf(state.digestTab) >= 0 ? state.digestTab : names[0];
    if (cats.length > 1) {
      tabsRow = h('div', { class: 'digest-tabs', role: 'tablist' }, cats.map(function (c) {
        return h('button', {
          class: 'digest-tab' + (c.name === curTab ? ' active' : ''),
          role: 'tab', 'aria-selected': c.name === curTab ? 'true' : 'false',
          onclick: function () { state.digestTab = c.name; renderView(); },
          text: c.name
        });
      }));
    }
    var shown = cats.filter(function (c) { return c.name === curTab; })[0] || cats[0];
    body.appendChild(mdRender(shown.text));
  } else {
    body.appendChild(h('div', { class: 'loading', text: 'Loading…' }));
    fetch('api/digest?date=' + encodeURIComponent(cur))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.body != null) { state.digestCache[cur] = j.body; if (state.view === 'digest') renderView(); }
      })
      .catch(function () {});
  }
  var head = h('div', { class: 'digest-head' }, [
    h('h2', { text: 'Daily digest' }),
    dates.length > 1
      ? h('select', { 'aria-label': 'Digest date',
          onchange: function (e) { state.digestDate = e.target.value; renderView(); } },
          dates.map(function (dt) {
            return h('option', { value: dt, text: dt + (dt === dates[0] ? ' — latest' : ''), selected: dt === cur || null });
          }))
      : null
  ]);
  var dateHead = h('div', { class: 'digest-date', text: digestDateLabel(cur) });
  return [h('section', { class: 'card', 'data-anim-key': 'card:digest' },
    [head, dateHead].concat(tabsRow ? [tabsRow] : []).concat([body]))];
}

/* ===========================================================================
   DATA view
   =========================================================================== */
var charts = [];
function dataView(d) {
  charts = [];
  var out = [];
  var c = d.counts, p = pct(c.done, c.total);
  var hero = h('div', { class: 'card' }, [
    h('div', { class: 'hero-val' }, [String(p), h('span', { text: '%' })]),
    h('div', { class: 'hero-label', text: 'complete' }),
    h('div', { class: 'hero-sub', text: c.done + ' of ' + c.total + ' tracked tasks' }),
    h('div', { class: 'meter', title: c.done + ' done, ' + c.open + ' open' }, [
      c.done ? h('i', { class: 'd', style: { flex: c.done } }) : null,
      c.open ? h('i', { class: 'o', style: { flex: c.open } }) : null
    ])
  ]);
  var mac = (d.seats.filter(function (x) { return x.seat === 'mac'; })[0] || { open: 0 }).open;
  var tiles = [
    { v: c.open, l: 'Open', c: 'var(--open)', n: 'to do, in progress or blocked' },
    { v: d.doneLast7, l: 'Done in 7 days', c: 'var(--done)', n: 'completions since ' + fDay(d.generatedAt - 7 * 864e5) },
    { v: c.in_progress, l: 'In progress', c: 'var(--warning)' },
    { v: c.blocked, l: 'Blocked', c: 'var(--critical)' },
    { v: mac, l: 'Mac-seat open', c: 'var(--muted)', n: 'this box cannot validate these' },
