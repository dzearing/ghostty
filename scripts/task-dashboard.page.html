  ];
  out.push(h('div', { class: 'lead' }, [hero, h('div', { class: 'tiles' }, tiles.map(function (t) {
    return h('div', { class: 'tile' }, [
      h('div', { class: 'v', text: String(t.v) }),
      h('div', { class: 'l' }, [h('span', { class: 'swatch', style: { background: t.c } }), t.l]),
      t.n ? h('div', { class: 'n', text: t.n }) : null
    ]);
  }))]));

  var progHost = h('div');
  out.push(card('Progress over time',
    'Every commit that changed the tracker, since ' + fDate(d.historyStart) + '. Scope grows as new tasks are filed, so the gap is the work still open.',
    [progHost, tableView('Table view — weekly snapshots', ['Date', 'Total', 'Done', 'Open', '%'], weeklyRows(d))]));
  charts.push(function () { drawProgress(progHost, d); });

  var dailyHost = h('div');
  out.push(card('Completed per day', 'Tasks whose status first became done that day.',
    [dailyHost, tableView('Table view — all days', ['Day', 'Completed'], d.daily.map(function (x) { return [fDate(x.ts), x.count]; }))]));
  charts.push(function () { drawDaily(dailyHost, d); });

  var priHost = h('div');
  out.push(card('Open work by priority', 'What is left, by severity band. P0 is a crash, a hang, or a broken feature.',
    [priHost, tableView('Table view', ['Priority', 'Open'],
      (d.priorities || []).map(function (r) { return [PRI_LABEL[r.priority] || r.priority, r.open]; }))]));
  charts.push(function () { drawPriorities(priHost, d); });
  return out;
}

function weeklyRows(d) {
  var out = [], lastWeek = null;
  d.series.forEach(function (p, i) {
    var wk = Math.floor(p.ts / (7 * 864e5));
    if (wk !== lastWeek || i === d.series.length - 1) {
      lastWeek = wk;
      out.push([fDate(p.ts), p.total, p.done, p.open, pct(p.done, p.total) + '%']);
    }
  });
  return out;
}

/* ===========================================================================
   TASKS view
   =========================================================================== */
function tasksView(d) {
  var f = state.filters;
  var sel = function (name, label, opts) {
    return h('select', { 'aria-label': label, onchange: function (e) { f[name] = e.target.value; renderTasks(); } },
      [h('option', { value: '', text: label })].concat(opts.map(function (o) {
        return h('option', { value: o[0], text: o[1], selected: f[name] === o[0] });
      })));
  };
  var input = h('input', {
    type: 'search', placeholder: 'Search id, title or summary…', 'aria-label': 'Search tasks',
    oninput: function (e) { f.q = e.target.value; renderTasks(); }
  });
  input.value = f.q;
  /* Status is a MULTISELECT: a checkbox per status plus an "All statuses"
     master, so "everything except Done" is one uncheck. Updates are surgical
     (summary text + sibling checkboxes), never a rebuild — a rebuild would
     snap the popup shut after every toggle. */
  var STATUS_KEYS = Object.keys(STATUS_LABEL);
  var statusSummaryText = function () {
    var s = f.statuses;
    if (!s) return 'Any status';
    var on = STATUS_KEYS.filter(function (k) { return s[k]; });
    if (on.length === STATUS_KEYS.length) return 'Any status';
    if (!on.length) return 'No statuses';
    var off = STATUS_KEYS.filter(function (k) { return !s[k]; });
    if (off.length < on.length) return 'Not: ' + off.map(function (k) { return STATUS_LABEL[k]; }).join(', ');
    return on.map(function (k) { return STATUS_LABEL[k]; }).join(', ');
  };
  var statusMulti = (function () {
    var summaryLabel = h('span', { text: statusSummaryText() });
    var itemBoxes = {};
    var allBox = h('input', { type: 'checkbox', 'aria-label': 'All statuses' });
    var sync = function () {
      var s = f.statuses;
      allBox.checked = !s || STATUS_KEYS.every(function (k) { return s[k]; });
      STATUS_KEYS.forEach(function (k) { itemBoxes[k].checked = !s || !!s[k]; });
      summaryLabel.textContent = statusSummaryText();
      renderTasks();
    };
    allBox.onchange = function () {
      if (allBox.checked) { f.statuses = null; }
      else {
        f.statuses = {};
        STATUS_KEYS.forEach(function (k) { f.statuses[k] = false; });
      }
      sync();
    };
    var items = STATUS_KEYS.map(function (k) {
      var cb = h('input', { type: 'checkbox', 'aria-label': STATUS_LABEL[k] });
      itemBoxes[k] = cb;
      cb.onchange = function () {
        if (!f.statuses) {
          f.statuses = {};
          STATUS_KEYS.forEach(function (x) { f.statuses[x] = true; });
        }
        f.statuses[k] = cb.checked;
        if (STATUS_KEYS.every(function (x) { return f.statuses[x]; })) f.statuses = null;
        sync();
      };
      return h('label', { class: 'ms-item' }, [cb, h('span', { text: STATUS_LABEL[k] })]);
    });
    var s0 = f.statuses;
    allBox.checked = !s0 || STATUS_KEYS.every(function (k) { return s0[k]; });
    STATUS_KEYS.forEach(function (k) { itemBoxes[k].checked = !s0 || !!s0[k]; });
    return h('details', { class: 'ms' }, [
      h('summary', { 'aria-label': 'Filter by status (multiselect)' }, [summaryLabel]),
      h('div', { class: 'ms-menu' }, [
        h('label', { class: 'ms-item' }, [allBox, h('span', { text: 'All statuses' })]),
        h('div', { class: 'ms-sep' })
      ].concat(items))
    ]);
  })();
  var controls = h('div', { class: 'filters' }, [
    input,
    statusMulti,
    sel('priority', 'Any priority', [
      ['P0', 'P0 - severe'], ['P1', 'P1 - feature + polish'],
      ['P2', 'P2 - infra'], ['untriaged', 'Untriaged']
    ]),
    sel('seat', 'Any seat', d.seats.map(function (x) { return [x.seat, 'Seat: ' + x.seat]; })),
    // Tag filter: the closed vocabulary first, then anything else the files
    // actually carry, so an off-vocabulary tag is still reachable.
    sel('tag', 'Any tag', (function () {
      var present = {};
      d.tasks.forEach(function (t) { (t.tags || []).forEach(function (tg) { present[tg] = true; }); });
      var known = Object.keys(TAG_TITLE).filter(function (k) { return present[k]; });
      var extra = Object.keys(present).filter(function (k) { return !TAG_TITLE[k]; }).sort();
      return known.concat(extra).map(function (k) { return [k, 'Tag: ' + k]; });
    })())
  ]);
  // Sortable: clicking a header toggles direction, clicking another switches
  // key. Newest-first is the default because a tracker is read for what just
  // landed, not for T01.
  var sortable = function (label, key, cls) {
    var active = state.sort.key === key;
    return h('th', {
      class: (cls || '') + ' sortable' + (active ? ' active' : ''),

      onclick: function () { toggleSort(key); },

    }, [label, active ? h('span', { class: 'arrow', text: state.sort.dir < 0 ? ' ▾' : ' ▴' }) : null]);
  };
  var table = h('table', { class: 'tasks' }, [

    ])]),

  ]);
  var c = card('All tasks', 'Queue order first — # is what the loop works down. Click a row for the full task, or a header to re-sort.',
    [controls, h('div', { class: 'tv-wrap' }, [table])]);

  c.querySelector('h2').appendChild(h('span', { class: 'count', id: 'tcount' }));

}

/* Clicking a header toggles direction; switching keys picks the direction that
   key is USEFUL in first. Dates and ids read newest-first; the queue and the
   priority band read best-first, because "1" is the answer to what next. */
var SORT_FIRST_DIR = { order: 1, priority: 1 };
function toggleSort(key) {
  if (state.sort.key === key) state.sort.dir = -state.sort.dir;
  else state.sort = { key: key, dir: SORT_FIRST_DIR[key] || -1 };
  renderView();
}

/** T01 < T89b < T90b < T428 — number first, then suffix. */
function idRank(id) {
  var m = /^[A-Za-z]*(\d+)(.*)$/.exec(id || '');
  return m ? Number(m[1]) * 1000 + (m[2] ? m[2].charCodeAt(0) - 96 : 0) : 0;
}

/** P0 first, untriaged last. */
function priRank(p) { return p === 'P0' ? 0 : p === 'P1' ? 1 : p === 'P2' ? 2 : 9; }

/** A date cell: short label, full date + time on hover, em dash when unknown. */
function dateCell(ts, cls) {
  return h('td', {
    class: 'when ' + (cls || ''),

  });
}

/* --- task detail dialog ---------------------------------------------------
   The row list shows a one-line summary; the whole task file is a fetch away
   rather than in every poll payload, because 485 whole files every five
   seconds is megabytes on the wire for content nobody is looking at. */
function openTask(t) {
  var body = h('div', { class: 'td-body', text: 'Loading…' });
  // How long the task has been ALIVE — created to finished for closed tasks,
  // created to a live-ticking "now" for open ones (user, 2026-08-07).
  var alivePill = h('span', { class: 'chip', title: t.createdAt ? 'Created ' + fDate(t.createdAt) + ' ' + fTime(t.createdAt) : '' });
  var closedEnd = (t.bucket === 'done' || t.bucket === 'skipped') ? (t.completedAt || t.modifiedAt) : null;
  var tickAlive = function () {
    if (!t.createdAt) { alivePill.textContent = ''; return; }
    alivePill.textContent = closedEnd
      ? 'lived ' + fDur(Math.max(closedEnd - t.createdAt, 0))
      : 'alive ' + fDur(Math.max(Date.now() - t.createdAt, 0));
  };
  tickAlive();
  var aliveTimer = closedEnd ? null : setInterval(tickAlive, 30000);
  var dlg = h('dialog', { class: 'taskdlg' }, [
    h('header', null, [
      h('div', { class: 'td-head' }, [
        h('span', { class: 'pri ' + (t.priority || 'none'), text: t.priority || '--' }),
        h('span', { class: 'pill ' + t.bucket }, [h('i'), STATUS_LABEL[t.bucket]]),
        h('code', { class: 'td-id', text: t.id }),
        alivePill
      ].concat(tagChips(t.tags))),
      h('button', { class: 'td-x', 'aria-label': 'Close', text: '×', onclick: function () { dlg.close(); } })
    ]),
    h('h3', { class: 'td-title', text: t.title }),
    h('div', { class: 'td-meta' }, [
      metaBit('Queue', t.order == null ? 'unordered' : '#' + t.order),
      metaBit('Created', t.createdAt ? fDate(t.createdAt) : 'unknown'),
      metaBit('Modified', t.modifiedAt ? fDate(t.modifiedAt) : 'unknown'),
      t.completedAt ? metaBit('Finished', fDate(t.completedAt)) : null,
      metaBit('Seat', t.seat),
      t.deps && t.deps.length ? metaBit('Deps', t.deps.join(', ')) : null,
      t.commits && t.commits.length ? metaBit('Commits', t.commits.join(', ')) : null
    ]),
    t.triageReason ? h('div', { class: 'td-why', text: 'Triage: ' + t.triageReason }) : null,
    body,
    h('footer', null, [h('code', { class: 'td-path', text: 'docs/design/windows-parity-tasks/' + t.id + '.md' })])
  ]);
  document.body.appendChild(dlg);
  // Clicking the backdrop (i.e. the dialog element itself, outside its
  // content box) closes — the standard <dialog> idiom.
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', function () { if (aliveTimer) clearInterval(aliveTimer); dlg.remove(); });
  dlg.showModal();

  fetch('/api/task?id=' + encodeURIComponent(t.id))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      body.textContent = '';
      var text = (j.body || '').trim();
      // Related work: every real task id the body or deps mention. The body
      // names what a task split from, superseded, or discovered — those are
      // the edges a reader follows, so they get chips up top and links inline.
      var seen = {};
      (t.deps || []).forEach(function (d) { seen[String(d).toUpperCase()] = true; });
      (text.match(/\bT\d+[a-z]?\d*\b/g) || []).forEach(function (d) { seen[d.toUpperCase()] = true; });
      delete seen[t.id.toUpperCase()];
      var jump = function (id) {
        var tt = taskById(id);
        if (tt) { dlg.close(); openTask(tt); }
      };

      if (rel.length) {
        body.appendChild(h('div', { class: 'td-rel' }, [h('b', { text: 'Related:' })].concat(rel.map(function (d) {
          return h('span', { class: 'chip link', title: taskById(d).title, text: taskById(d).id,
            onclick: function () { jump(d); } });
        }))));

      // monospace dump — this dialog is the L2 view of the task: the goal,
      // the run's progress log, and the validation criteria all read as
      // sections. mdRender is textContent-based throughout, so the loop's
      // markdown can never inject markup.
      var md = mdRender(text);
      linkifyTaskIds(md, jump);
      body.appendChild(md);
    })
    .catch(function (e) { body.textContent = 'Could not load: ' + e.message; });
}

/**
 * Wrap task-id mentions in rendered markdown with links that jump to that
 * task's dialog. Only ids that actually exist link — "T30" in a sentence
 * about a task that was never filed stays plain text.
 */
function linkifyTaskIds(root, jump) {
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  var nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function (n) {
    var p = n.parentNode;
    if (!p) return;
    // Never inside an existing link, code, a button, or a chip that already
    // navigates — a nested link would double-fire or restyle the control.
    if (p.tagName === 'A' || p.tagName === 'CODE' || p.tagName === 'BUTTON' ||
        p.tagName === 'OPTION' || (p.closest && p.closest('.chip, .tid-link'))) return;
    var re = /\bT\d+[a-z]?\d*\b/g;
    var str = n.nodeValue, m, last = 0, frag = null;
    while ((m = re.exec(str))) {
      var t = taskById(m[0]);
      if (!t) continue;
      if (!frag) frag = document.createDocumentFragment();
      frag.appendChild(document.createTextNode(str.slice(last, m.index)));
      frag.appendChild(h('a', {
        href: '#', class: 'tid-link', text: m[0], title: t.title,
        // stopPropagation: many hosts (task-table rows, activity cards) have
        // their OWN click handler; the id link must win, not fire both.
        onclick: (function (id) { return function (e) { e.preventDefault(); e.stopPropagation(); jump(id); }; })(m[0])
      }));
      last = m.index + m[0].length;
    }
    if (frag) {
      frag.appendChild(document.createTextNode(str.slice(last)));
      n.parentNode.replaceChild(frag, n);
    }
  });
}

/** Every task-id mention anywhere in a rendered view opens that task's
    dialog (user, 2026-08-07) — the loop card, blocked lists, digest prose,
    table titles, all of it. */
function linkifyView(root) {
  linkifyTaskIds(root, function (id) {
    var t = taskById(id);
    if (t) openTask(t);
  });
}
function metaBit(label, value) {
  return h('span', { class: 'td-bit' }, [h('b', { text: label }), h('span', { text: String(value) })]);
}

function renderTasks() {
  var d = state.data;
  if (!d) return;
  var f = state.filters, q = f.q.trim().toLowerCase();
  var rows = d.tasks.filter(function (t) {
    if (f.statuses && !f.statuses[t.bucket]) return false;
    if (f.tag && (t.tags || []).indexOf(f.tag) < 0) return false;
    if (f.priority && (t.priority || 'untriaged') !== f.priority) return false;
    if (f.seat && t.seat !== f.seat) return false;
    if (q && (t.id + ' ' + t.title + ' ' + t.summary).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });

  var dir = state.sort.dir;
  // A date key sorts on its own value; rows with no date park at the end in
  // BOTH directions rather than letting a null sort as "oldest".
  var DATE_KEY = { finished: 'completedAt', created: 'createdAt', modified: 'modifiedAt' };
  rows.sort(function (a, b) {
    var k = state.sort.key;
    if (k === 'order') {
      // Unordered tasks park at the end in BOTH directions: flipping the sort
      // is meant to show you the tail of the queue, not 300 blanks.
      var ao = a.order, bo = b.order;
      if (ao == null && bo == null) return idRank(b.id) - idRank(a.id);
      if (ao == null) return 1;
      if (bo == null) return -1;
      if (ao !== bo) return (ao - bo) * dir;
      return idRank(a.id) - idRank(b.id);
    }
    if (k === 'priority') {
      // Untriaged after P2, always — an unranked task must not outrank one
      // somebody deliberately called nice-to-have.
      var ar = priRank(a.priority), br = priRank(b.priority);
      if (ar !== br) return (ar - br) * dir;
      return idRank(b.id) - idRank(a.id);
    }
    if (DATE_KEY[k]) {
      var av = a[DATE_KEY[k]], bv = b[DATE_KEY[k]];
      if (av == null && bv == null) return (idRank(b.id) - idRank(a.id)) * (dir < 0 ? 1 : -1);
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * dir;
    }
    return (idRank(a.id) - idRank(b.id)) * dir;
  });

  var body = $('#tbody');
  if (!body) return;
  body.innerHTML = '';
  rows.forEach(function (t) {
    var pri = t.priority || '--';
    var tr = h('tr', {
      class: 't-row', role: 'button', tabindex: '0',
      title: t.triageReason || '',
      onclick: function () { openTask(t); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openTask(t); } }
    }, [
      h('td', { class: 'ord', text: t.order == null ? '—' : String(t.order) }),
      h('td', { text: t.id }),
      h('td', null, [h('span', { class: 'pri ' + (t.priority || 'none'), text: pri })]),
      h('td', null, [h('span', { class: 'pill ' + t.bucket }, [h('i'), STATUS_LABEL[t.bucket]])]),
      h('td', null, [
        h('div', { class: 't-title' }, [document.createTextNode(t.title + ' ')].concat(tagChips(t.tags))),
        t.summary ? h('div', { class: 't-sum', text: t.summary }) : null,
        t.deps.length ? h('div', { class: 't-deps', text: 'deps: ' + t.deps.join(', ') }) : null
      ]),
      dateCell(t.createdAt, 'hide-sm'),
      dateCell(t.modifiedAt, ''),
      h('td', { class: 'fin', title: t.completedAt ? fDate(t.completedAt) + ' ' + fTime(t.completedAt) : '',
        text: t.completedAt ? fDay(t.completedAt) : (t.bucket === 'done' ? 'before tracking' : '—') }),
      h('td', { class: 'hide-sm', text: t.seat })
    ]);
    body.appendChild(tr);
  });
  var c = $('#tcount');
  if (c) c.textContent = rows.length === d.tasks.length
    ? ' (' + d.tasks.length + ' total)'
    : ' (' + rows.length + ' of ' + d.tasks.length + ' total)';
  linkifyView(body);
}

function go(view) {
  state.view = view;
  if (location.hash.slice(1) !== view) location.hash = view;
  renderNav();
  renderView();
  scrollTo(0, 0);
}
addEventListener('hashchange', function () {
  var v = location.hash.slice(1);
  if (VIEWS.indexOf(v) >= 0 && v !== state.view) { state.view = v; renderNav(); renderView(); }
});

function renderNav() {
  var d = state.data;
  var nav = $('#nav');
  nav.innerHTML = '';
  [['activity', 'Activity'], ['digest', 'Daily digest'], ['data', 'Data'], ['tasks', 'Tasks']].forEach(function (v) {
    var badge = null;
    if (v[0] === 'activity' && d && d.openDecisions) badge = h('span', { class: 'badge', text: String(d.openDecisions) });
    nav.appendChild(h('button', {
      type: 'button', 'aria-current': state.view === v[0] ? 'page' : null,
      onclick: function () { go(v[0]); }
    }, [v[1], badge]));
  });
}

var lastRenderedView = null;

function renderView() {
  var d = state.data;
  if (!d) return;
  var host = $('#view');
  // FLIP snapshot: capture where every keyed element WAS (and a clone of it,
  // for exit ghosts) before the re-render wipes the DOM. Only within the same
  // view — a nav switch replacing everything is not "items came and went".
  var prev = null;
  if (lastRenderedView === state.view && host.children.length &&
      !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    prev = {};
    host.querySelectorAll('[data-anim-key]').forEach(function (el) {
      prev[el.getAttribute('data-anim-key')] = { rect: el.getBoundingClientRect(), clone: el.cloneNode(true) };
    });
  }
  host.innerHTML = '';
  var nodes = state.view === 'data' ? dataView(d) : state.view === 'tasks' ? tasksView(d)
    : state.view === 'digest' ? digestView(d) : activityView(d);
  nodes.forEach(function (n) { host.appendChild(n); });
  if (state.view === 'tasks') renderTasks();
  if (state.view === 'data') drawAll();
  linkifyView(host);
  if (prev) playFlip(host, prev);
  lastRenderedView = state.view;
}

/**
 * FLIP the keyed elements between renders: entered items fade+slide in, moved
 * items glide from where they were, removed items fade out as fixed-position
 * ghosts of their old selves. Nested keys move RELATIVE to their nearest keyed
 * ancestor (standard nested-FLIP correction), or a card and its children would
 * each play the same journey and the children would visually travel twice.
 */
function playFlip(host, prev) {
  var EASE = 'cubic-bezier(.2, .7, .3, 1)';
  var seen = {};
  var moves = {};
  var els = host.querySelectorAll('[data-anim-key]');
  els.forEach(function (el) {
    var k = el.getAttribute('data-anim-key');
    seen[k] = true;
    if (!prev[k]) return;
    var now = el.getBoundingClientRect();
    moves[k] = { dx: prev[k].rect.left - now.left, dy: prev[k].rect.top - now.top };
  });
  els.forEach(function (el) {
    var k = el.getAttribute('data-anim-key');
    var anc = el.parentElement && el.parentElement.closest('[data-anim-key]');
    var ancKey = anc ? anc.getAttribute('data-anim-key') : null;
    if (!prev[k]) {
      // Entered. If its whole card is also new, the card's entrance covers it.
      if (ancKey && !prev[ancKey]) return;
      el.animate([{ opacity: 0, transform: 'translateY(-10px)' }, { opacity: 1, transform: 'none' }],
        { duration: 300, easing: EASE });
      return;
    }
    var pd = ancKey ? moves[ancKey] : null;
    var dx = moves[k].dx - (pd ? pd.dx : 0), dy = moves[k].dy - (pd ? pd.dy : 0);
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
      el.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }],
        { duration: 300, easing: EASE });
    }
  });
  // Exits: ghost only the OUTERMOST removed element — an option inside a
  // resolved decision leaves with its card, not as its own flying scrap.
  Object.keys(prev).forEach(function (k) {
    if (seen[k]) return;
    var r = prev[k].rect;
    var contained = Object.keys(prev).some(function (pk) {
      if (pk === k || seen[pk]) return false;
      var pr = prev[pk].rect;
      return pr.left <= r.left && pr.top <= r.top && pr.right >= r.right && pr.bottom >= r.bottom &&
        (pr.width > r.width || pr.height > r.height);
    });
    if (contained) return;
    var g = prev[k].clone;
    g.style.position = 'fixed';
    g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    g.style.margin = '0'; g.style.zIndex = '30'; g.style.pointerEvents = 'none';
    document.body.appendChild(g);
    var a = g.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-10px) scale(.98)' }],
      { duration: 240, easing: 'ease-out' });
    a.onfinish = function () { g.remove(); };
    setTimeout(function () { if (g.parentNode) g.remove(); }, 500);
  });
}

function drawAll() { charts.forEach(function (fn) { fn(); }); }
var rt;
addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (state.view === 'data') drawAll(); }, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (state.view === 'data') drawAll(); });

function setMeta(d, stale) {
  $('#brandsub').textContent = d.branch || '';
  var m = $('#meta');
  m.innerHTML = '';
  apply(m, null, [
    h('span', { class: 'dot-live' + (stale ? ' stale' : '') }),
    h('span', { text: d.tasks.length + ' tasks' }),
    h('span', { text: (stale ? 'last good ' : '') + fClock(d.generatedAt) })
  ]);
}

function signature(d) {
  return JSON.stringify([
    d.counts,
    d.tasks.map(function (t) {
      // Tags and the newest progress note are rendered on cards, so a change
      // to either must re-render — status+title alone would sit stale.
      var lastProg = t.progress && t.progress.length ? t.progress[t.progress.length - 1].text : '';
      return t.id + t.status + t.title + (t.tags || []).join(',') + lastProg;
    }),
    d.decisions.map(function (x) { return x.id + x.status + x.answer; }),
    d.digests, d.digest && d.digest.body,
    d.activity.length, d.series.length, d.daily.map(function (x) { return x.count; })
  ]);
}

function refresh(force) {
  return fetch('api/data', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      // The served code changed under us (someone edited the dashboard). A
      // stale shell against a new API fails silently, so reload rather than
      // keep rendering something that is quietly wrong.
      if (state.pageVersion == null) state.pageVersion = d.pageVersion;
      else if (d.pageVersion !== state.pageVersion) { location.reload(); return; }
      $('#err').innerHTML = '';
      var sig = signature(d);
      state.data = d;
      if (force || sig !== state.sig) { state.sig = sig; renderNav(); renderView(); }
      setMeta(d, false);
    })
    .catch(function (e) {
      if (state.data) setMeta(state.data, true);
      $('#err').innerHTML = '';
      $('#err').appendChild(h('div', { class: 'err',
        text: 'Cannot reach the dashboard server (' + e.message + '). Showing the last good data. Restart: powershell -File scripts\\task-dashboard.ps1' }));
    });
}

function poll() { refresh(false).finally(function () { setTimeout(poll, POLL_MS); }); }

/* `?task=T377` opens that task's dialog once the data has loaded, so a task is
   linkable — and so the dialog is reachable from a headless screenshot, which
   is how it gets checked. Fires once, not on every poll. */
var deepLink = /[?&]task=([A-Za-z]\d+[a-z]?\d*)/.exec(location.search);
if (deepLink) {
  var wanted = deepLink[1].toUpperCase(), fired = false;
  var openWhenReady = setInterval(function () {
    if (fired || !state.data) return;
    var t = state.data.tasks.filter(function (x) { return x.id.toUpperCase() === wanted; })[0];
    fired = true;
    clearInterval(openWhenReady);
    if (t) openTask(t);
  }, 120);
}

/* `?event=<sha>` opens that commit's event dialog once the data has loaded —
   the event-L2 analog of the ?task= link above, and how the dialog reaches a
   headless screenshot. Fires once, not on every poll. */
var evLink = /[?&]event=([0-9a-fA-F]{7,40})/.exec(location.search);
if (evLink) {
  var evWanted = evLink[1].toLowerCase(), evFired = false;
  var evWhenReady = setInterval(function () {
    if (evFired || !state.data) return;
    var a = state.data.activity.filter(function (x) {
      // Either side may be the shorter spelling of the same sha.
      var s = x.sha ? x.sha.toLowerCase() : '';
      return s && (s.indexOf(evWanted) === 0 || evWanted.indexOf(s) === 0);
    })[0];
    evFired = true;
    clearInterval(evWhenReady);
    if (a) openEvent(a);
  }, 120);
}

/* `?selftest=event` drives the first timeline card through its event L2 from
   inside a real browser (T505) — the acceptance script runs it under headless
   Edge and reads the verdict back out of the DOM, because a click path is not
   something an HTTP probe can see. Same fire-once shape as the ?task= deep
   link above. Steps: click the card → the event dialog opens → the commit
   message actually loads → close returns to the view. The verdict lands in
   <title> and in a #selftest node (belt and braces: --dump-dom sees both). */
if (/[?&]selftest=event/.test(location.search)) {
  var stFired = false;
  var stDone = function (verdict) {
    document.title = verdict;
    document.body.appendChild(h('div', { id: 'selftest', text: verdict }));
  };
  var stWait = setInterval(function () {
    if (stFired || !state.data) return;
    stFired = true;
    clearInterval(stWait);
    try {
      var cardEl = document.querySelector('.ev');
      if (!cardEl) return stDone('T505-SELFTEST FAIL: no timeline card rendered');
      cardEl.click();
      var dlg = document.querySelector('dialog.taskdlg');
      if (!dlg || !dlg.open || !dlg.querySelector('.evk')) {
        return stDone('T505-SELFTEST FAIL: clicking the card did not open the event dialog');
      }
      // The commit message is a fetch away; give it a few seconds.
      var tries = 0;
      var msgWait = setInterval(function () {
        var md = dlg.querySelector('.md');
        var loaded = md && md.textContent && md.textContent !== 'Loading…';
        if (!loaded && ++tries < 50) return;
        clearInterval(msgWait);
        if (!loaded) return stDone('T505-SELFTEST FAIL: the commit message never loaded');
        if (dlg.querySelector('.evd-err')) {
          return stDone('T505-SELFTEST FAIL: ' + dlg.querySelector('.evd-err').textContent);
        }
        dlg.close();
        if (dlg.open) return stDone('T505-SELFTEST FAIL: the dialog did not close');
        // The close handler removes the node from a queued close event, and
        // under headless virtual time that task can lag well past a fixed
        // delay — poll, like the message wait above, rather than spot-check.
        var rmTries = 0;
        var rmWait = setInterval(function () {
          if (document.querySelector('dialog.taskdlg') && ++rmTries < 50) return;
          clearInterval(rmWait);
          if (document.querySelector('dialog.taskdlg')) {
            return stDone('T505-SELFTEST FAIL: closing the dialog did not remove it');
          }
          stDone('T505-SELFTEST PASS');
        }, 100);
      }, 100);
    } catch (e) {
      stDone('T505-SELFTEST FAIL: ' + e.message);
    }
  }, 120);
}

/* A click outside an open multiselect closes it — <details> only toggles on
   its own summary, so without this the popup lingers over the table. */
document.addEventListener('click', function (e) {
  var open = document.querySelectorAll('details.ms[open]');
  for (var i = 0; i < open.length; i++) {
    if (!open[i].contains(e.target)) open[i].removeAttribute('open');
  }
});

renderNav();
poll();
</script>
</body>
</html>
